/* Guest mode: Excel catalogue visible without editing or exposing any cloud data. */

body.cloud-guest #toggleDesc,
body.cloud-guest #editVideo,
body.cloud-guest #clearVideo,
body.cloud-guest .history-add,
body.cloud-guest .delHist,
body.cloud-guest .detail-rpe,

body.cloud-guest #resetData,

body.cloud-guest .top-actions [data-import]{display:none!important}
.cloud-uid {font-size:12px;color:#64748b;margin-top:5px;overflow-wrap:anywhere}

/* 動作編輯：雙欄肌群選擇與即時模型 */
.editor-muscle-layout{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr);gap:16px;align-items:start}
.editor-muscle-controls{display:grid;gap:14px;min-width:0}

.auto-muscle-label{color:#c52230;font-size:13px;font-weight:700;border-radius:7px;background:#fff0f0;padding:4px 6px;white-space:nowrap}
.muscle-text-box input{flex:1 1 160px;min-width:110px;border:0;outline:0;background:transparent;color:#101828;font:inherit;padding:4px}

@media(max-width:900px){.editor-muscle-layout{grid-template-columns:1fr}.editor-preview{position:static}.editor-muscle-controls .muscle-picker{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* Member action synchronization and record management */
.history-day-entry{position:relative}

.record-tools label{display:flex;align-items:center;gap:6px;font-size:13px;color:#475569}
.record-tools input[type=checkbox]{width:17px;height:17px;accent-color:#2563eb}
.record-edit-dialog,.reset-dialog{border:1px solid #dbe3ee;border-radius:16px;padding:22px;box-shadow:0 20px 70px #0003;color:#17233b;background:white;width:min(94vw,520px);max-height:90vh;overflow:auto}
.record-edit-dialog::backdrop,.reset-dialog::backdrop{background:#12263d77}

.history-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 20px}

/* 訓練紀錄：Gmail 式左側勾選、右側編輯 */

const INITIAL_DATA=[{"id":"excel-2","large":"下肢","detail":"小腿／足踝","name":"腿推機小腿訓練","primary":"腓腸肌、比目魚肌","secondary":"足底穩定、足踝控制、脛後肌","description":"雙腳打直膝蓋鎖死,只有上腳掌踩踏板腳跟懸空,往下時,腳跟慢慢往下延伸,腳掌隨之上翹,慢慢下至小腿伸展極限,然後停頓一下再抬回,節奏下降3秒>停2秒>抬起1秒","warmup":"踝關節前移活動 10 下/側\n腳踝繞圈 10 下/側\n徒手提踵 15 下 × 1 組\n脛前肌抬腳 15 下 × 1 組\n主動作輕重量 1–2 組","primaryMuscles":["calves"],"secondaryMuscles":["ankle_foot"],"history":[]},{"id":"excel-3","large":"上肢","detail":"肩部／中三角","name":"Cable上肩划船","primary":"中三角肌、上斜方肌","secondary":"前三角肌、前臂、核心穩定","description":"站在滑輪前，雙手抓住纜繩兩端，手放在身體前方，先把核心收穩、胸口打開。出力時讓手肘往外上方帶，把纜繩沿著身體前方拉到上胸附近；到頂點時，手會自然比一般直槓版本更分開。再慢慢放回起始位置，過程中保持張力，不要直接放掉","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n彈力帶拉開 12–15 下\n輕重量目標動作 1–2 組","primaryMuscles":["traps","side_delts"],"secondaryMuscles":["front_delts","forearms","deep_core"],"history":[]},{"id":"excel-4","large":"上肢","detail":"手臂／三頭","name":"Cable過頭三頭屈伸","primary":"肱三頭肌","secondary":"核心穩定、肩胛穩定","description":"Cable滑輪移到下方,雙手抓纜繩、背部挺直、核心收緊,手肘指向天花板,手抓握位於後腦杓後方。用三頭肌伸直,下放比抬起更慢。吸氣,控制慢慢下放,手肘位置固定不外開；吐氣,以肱三頭肌發力將手肘伸直,把纜繩舉回上方。全程上臂保持穩定,只動手肘關節,不後仰、不聳肩","warmup":"肩關節環繞 10 下/側 × 1–2 組\n肩關節穿越(PVC Pass-Through) 10 下\n手肘屈伸活動 10–15 下\n輕重量三頭下拉 15 下 × 1–2 組","primaryMuscles":["triceps"],"secondaryMuscles":["deep_core","rotator_cuff"],"history":[]},{"id":"excel-5","large":"下肢","detail":"後鏈／髖主導","name":"Single Leg RDL","primary":"腿後肌群、臀大肌","secondary":"臀中肌、下背穩定、核心穩定、足踝穩定","description":"節奏下放（髖折）3 秒＞底部停 1 秒、感受支撐側臀部與腿後側拉緊＞起身 1–2 秒（臀肌主導）。單腳站立，支撐腳膝蓋微彎，核心收緊、背部保持中立，骨盆盡量維持水平。動作開始時將臀部往後推，同時懸空腳向後延伸，讓軀幹與後腿像一整條線一起傾斜；啞鈴沿支撐腿前側或兩側往下，不要主動彎腰去找地面。下降到腿後側有明顯拉伸感、且骨盆仍能保持穩定的位置即可，不必追求啞鈴碰地。起身時由支撐腳臀大肌與腿後肌發力伸髖回正，避免用下背硬拉。回到站姿後，懸空腳可輕點地重新找穩定，再進下一下；輕點時不要把重量完全轉回雙腳。全程避免支撐膝內夾、骨盆向外翻開、身體左右晃動或聳肩代償。\n影片:https://www.youtube.com/watch?v=Gj1nNdNdBaw","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n主動作輕重量 1–2 組","primaryMuscles":["glutes","hamstrings"],"secondaryMuscles":["deep_core","lower_back","glute_med","ankle_foot"],"history":[]},{"id":"excel-6","large":"核心","detail":"核心／下腹控制","name":"下斜板反向捲腹","primary":"腹直肌下段、腹橫肌","secondary":"髖屈肌群、骨盆後傾控制","description":"躺在可調式仰臥起坐椅上,調到15度,頭靠著把手,捲腹時吐氣,腹部發力膝蓋朝胸捲起,尾骨輕輕離板,伸展時慢吸氣,由腹部慢慢打開腳再慢慢伸直,過程中腳都是懸空的,保持腹張力,動作流程（上 1 秒－頂停 1 秒－下 3 秒）。","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n死蟲式 4–6 下/側\n反向捲腹小幅度 6–8 下\n保持下背穩定，不要用腰代償","primaryMuscles":["abs","deep_core"],"secondaryMuscles":["hip_flexors"],"history":[]},{"id":"excel-7","large":"綜合","detail":"爆發力／藥球","name":"丟藥球","primary":"核心爆發力、核心旋轉、肩背協調","secondary":"髖伸展、臀腿發力、心肺、握力","description":"第1~2組,4kg連續丟60s,第3~5組,6kg丟30s。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n半跪姿胸椎旋轉 10 下/側\n肩關節環繞 10 下/側 × 1 組\n藥球輕拋 3–5 下 × 1–2 組","primaryMuscles":["upper_back","deep_core"],"secondaryMuscles":["forearms","glutes"],"history":[]},{"id":"excel-8","large":"下肢","detail":"後鏈／髖主導","name":"低滑輪單腳髖鉸鍊／偏臀部版 Cable 單腳 RDL","primary":"臀大肌、腿後肌群","secondary":"臀中肌、足踝穩定、核心抗旋轉、下背穩定","description":"左腳當主力腳,右手抓低滑輪握把,讓線一直保持張力,動作時身體慢慢往前傾,同時左臀往後推,左膝只微彎,且盡量保持在腳踝上方,不要一直往前跑\n當左臀與左腿後側感覺被拉緊後,再用左臀發力把身體帶回來。\n重點不是用手拉滑輪,而是做出像 RDL（羅馬尼亞硬舉） 那種髖往後折、再用臀部伸回來的感覺\n影片:https://www.youtube.com/watch?v=2M1Mikqf5lY","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n主動作輕重量 1–2 組","primaryMuscles":["glutes","hamstrings"],"secondaryMuscles":["deep_core","lower_back","glute_med","ankle_foot"],"history":[]},{"id":"excel-9","large":"下肢","detail":"臀部／髖穩定","name":"側臥髖外展","primary":"臀中肌","secondary":"臀小肌、深層外旋肌、骨盆穩定、核心穩定","description":"類似蚌殼式。側躺,身體成一直線,骨盆微微後轉,使上半身成同一平面,但不要拱背,上側腳膝蓋伸直、腳尖微內扣。抬腿時吐氣,將腿抬至約 30°,感受臀中肌外側出力,骨盆保持穩定,不後轉或往後滾。\n節奏抬起1-2秒>下放2-3秒,保持張力不碰下方的腳。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n臀橋 10–12 下 × 1 組\n側臥髖外展或蚌殼式 10–12 下/側","primaryMuscles":["glute_med"],"secondaryMuscles":["deep_core"],"history":[]},{"id":"excel-10","large":"上肢","detail":"肩部／前三角","name":"側躺啞鈴前平舉","primary":"前三角肌","secondary":"中三角肌、肩袖穩定","description":"身體側躺撐在訓練椅上，上半身用手肘支撐，胸口微微朝斜上方打開，另一手拿啞鈴放在髖前方，手腕微上折、手臂打直，以肩關節為支點把啞鈴往前上方抬起，約到 45 度後再慢慢放回原位。","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n彈力帶拉開 12–15 下\n輕重量目標動作 1–2 組","primaryMuscles":["front_delts"],"secondaryMuscles":["side_delts","rotator_cuff"],"history":[]},{"id":"excel-11","large":"下肢","detail":"單腳穩定","name":"分腿蹲(大腿前側)","primary":"股四頭肌、臀大肌","secondary":"內收肌群、臀中肌、核心穩定、骨盆穩定","description":"前腳踩在墊高物上（約 5–10 公分）,前腳膝蓋彎曲約 90 度。後腳向後跨一大步,以前腳掌支撐,腳跟離地,抬頭挺胸、收緊核心,髖骨擺正朝前,重心放在前腳,前腳同側的手可扶著穩定。\n下蹲時吸氣，前腳膝蓋對準第 2–3 趾，身體往下與微微向前，前腳腳跟貼地不離地，感受前腳大腿前側出力、同時後腳大腿前側被拉伸,下到臀部貼近小腿。\n起立時吐氣，以前腳大腿前側與臀部發力推起身體，回到起始的 90 度位置即可。節奏下放3秒>起立1-2秒","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n單腳站姿平衡 20–30 秒/側\n徒手分腿蹲 8 下/側","primaryMuscles":["glutes","quads"],"secondaryMuscles":["deep_core","glute_med","adductors"],"history":[]},{"id":"excel-12","large":"下肢","detail":"單腳穩定","name":"分腿蹲+Cable(大腿前側)","primary":"臀大肌、股四頭肌","secondary":"內收肌群、臀中肌、核心穩定、骨盆穩定","description":"前腳踩在墊高物上（約 5–10 公分）,前腳膝蓋彎曲約 90 度。後腳向後跨一大步,以前腳掌支撐,腳跟離地,抬頭挺胸、收緊核心,髖骨擺正朝前,重心放在前腳,前腳同側的手扶髖,對側手拉滑輪(5kg),手打直與拉繩成一直線。\n下蹲時吸氣，前腳膝蓋對準第 2–3 趾，身體往下與微微向前，前腳腳跟貼地不離地，感受前腳大腿前側出力、同時後腳大腿前側被拉伸,下到臀部貼近小腿。\n起立時吐氣，以前腳大腿前側與臀部發力推起身體，回到起始的 90 度位置即可。節奏下放3秒>起立1-2秒。10下/側*3,間休1分鐘","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n單腳站姿平衡 20–30 秒/側\n徒手分腿蹲 8 下/側","primaryMuscles":["glutes","quads"],"secondaryMuscles":["deep_core","glute_med","adductors"],"history":[]},{"id":"excel-13","large":"下肢","detail":"後鏈／腿後肌","name":"北歐腿後肌彎舉","primary":"腿後肌群","secondary":"臀大肌、腓腸肌、核心穩定","description":"固定好小腿後,用髖折的方式,折至水平再往下45度,停頓一秒後起身。進階折至水平再往下60度,停頓一秒後起身。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n腿後彎曲輕重量 12–15 下 × 1 組","primaryMuscles":["hamstrings"],"secondaryMuscles":["deep_core","glutes","calves"],"history":[]},{"id":"excel-14","large":"下肢","detail":"內收肌／骨盆穩定","name":"半跪滑台內收肌訓練","primary":"內收肌群","secondary":"核心抗側屈、臀中肌、骨盆穩定","description":"一腳跪在滑台上,另一腳踩地、手拿棍子輔助平衡 。跪姿那隻腳向外滑 → 內收肌「離心控制」,再用大腿內側拉回 → 內收肌「向心收縮」","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n內收肌岩石式活動 8–10 下/側\n低強度短槓桿哥本哈根 10–20 秒/側","primaryMuscles":["adductors"],"secondaryMuscles":["obliques","deep_core","glute_med"],"history":[]},{"id":"excel-15","large":"下肢","detail":"股四頭肌／膝主導","name":"反向北歐式彎舉(Cable 輔助版)","primary":"股四頭肌","secondary":"髖屈肌群、核心穩定、臀部穩定","description":"面向 Cable 機器,高跪姿雙膝跪地（膝下墊軟墊）,膝蓋與髖同寬,腳背貼地,雙手將Cable拉至胸前,Cable 保持微張力,核心收緊、骨盆中立，身體從膝蓋到頭保持一直線。\n下放吸氣,以膝關節為支點,整個身體像一塊木板慢慢往後倒,重點感受大腿前側被拉長,下到你能控制的角度即可,身體整塊往後,不要折腰,用大腿前側在煞車。\n吐氣,以股四頭肌發力,配合 Cable 輔助,把身體拉回直立,手只是輔助平衡與減重,不是用手把自己拉起來,回到起始姿勢,身體仍保持一直線,不要後仰。\n節奏下放 4–5 秒（越慢越有效）>底部停 0–1 秒>回正 1–2 秒。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n高跪姿股直肌伸展 8–10 下/側\n側向深蹲 10 下/側 × 1 組\n主動作空重或輕重量 1–2 組","primaryMuscles":["quads"],"secondaryMuscles":["deep_core","hip_flexors"],"history":[]},{"id":"excel-16","large":"核心","detail":"核心／下腹控制","name":"反向捲腹","primary":"腹直肌下段、腹橫肌","secondary":"髂腰肌、骨盆穩定、下腹控制","description":"躺在可調式仰臥起坐椅上,椅面調至水平,頭靠在把手位置,雙手穩定抓住把手。上背貼合椅墊、核心收緊,雙腳併攏打直、懸空。吐氣,以腹部發力將雙腳捲起至腹部上跟,下背離開座椅,而不是用力抬腿。吸氣,控制下放,讓背慢慢貼回椅墊,由腹部慢慢打開,雙腳維持打直並緩慢下降,過程中腳不碰地、保持腹部張力","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n死蟲式 4–6 下/側\n反向捲腹小幅度 6–8 下\n保持下背穩定，不要用腰代償","primaryMuscles":["abs","deep_core"],"secondaryMuscles":["hip_flexors"],"history":[]},{"id":"excel-17","large":"核心","detail":"核心／下腹控制","name":"反向捲腹＋骨盆抬舉","primary":"腹直肌下段、腹橫肌、骨盆後傾控制","secondary":"髂腰肌、骨盆穩定","description":"躺在可調式仰臥起坐椅上,椅面調至水平,頭靠在把手位置,雙手穩定抓住把手。上背貼合椅墊、核心收緊,雙腳併攏打直、懸空。吐氣,以腹部發力將雙腳往上捲起,而不是用力抬腿。當雙腳抬至與地面約垂直時,持續用腹部力量讓骨盆微微後傾、臀部離開椅墊,將雙腳再向上抬一小段,感受下腹明顯收縮。吸氣,控制下放,讓上背慢慢貼回椅墊,由腹部慢慢打開,雙腳維持打直並緩慢下降,過程中腳不碰地、保持腹部張力。抬起 2 秒>頂端停 1 秒>下放 3 秒。","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n死蟲式 4–6 下/側\n反向捲腹小幅度 6–8 下\n保持下背穩定，不要用腰代償","primaryMuscles":["abs","deep_core"],"secondaryMuscles":["hip_flexors"],"history":[]},{"id":"excel-18","large":"上肢","detail":"肩部／前三角","name":"反手肩推","primary":"前三角肌","secondary":"肱三頭肌、胸大肌上束、核心穩定","description":"椅背調至60~75度,掌心面向自己,舉在兩側斜前方。手肘直上直下,往上時不完全打直,往下時不做停留","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n彈力帶拉開 12–15 下\n輕重量目標動作 1–2 組","primaryMuscles":["front_delts"],"secondaryMuscles":["chest","triceps","deep_core"],"history":[]},{"id":"excel-19","large":"上肢","detail":"肩部／推","name":"坐姿啞鈴肩推","primary":"前三角肌、中三角肌","secondary":"肱三頭肌、上斜方肌、核心穩定","description":"坐在90度訓練椅上，肩胛與臀部穩定靠住椅背，胸口微挺，下背可自然微微離開椅背，但不要刻意拱腰。雙腳踩穩地面。預備時先將啞鈴放在大腿上，身體坐穩後，利用膝蓋上頂或雙腳微微抬起的力量，順勢將啞鈴帶到肩膀兩側，不要直接用手臂硬拉上去。\n\n起始位置時，手肘位於身體兩側約 45 度斜前方，不要完全打開成 90 度。掌心朝內斜前方，啞鈴擺放略呈外八角度，讓手腕、手肘與肩膀保持自然對線。核心收緊、肋骨不要外翻。\n\n吐氣時將啞鈴往上推至手臂接近伸直，但不要完全鎖死手肘；吸氣時控制下放回肩膀兩側。過程中避免聳肩、腰椎過度拱起或用身體晃動借力，重點感受前三角肌、中三角肌與三頭肌出力，並維持肩胛穩定。\n\n結束時不要直接把啞鈴往地上丟。先控制啞鈴回到肩膀旁，再一樣用膝蓋或大腿接住啞鈴，順勢將啞鈴放回大腿上，確認穩定後再放下。","warmup":"","primaryMuscles":["front_delts","side_delts"],"secondaryMuscles":["traps","triceps","deep_core"],"history":[]},{"id":"excel-20","large":"核心","detail":"腹部／屈曲","name":"可調式仰臥起坐椅核心訓練","primary":"腹直肌","secondary":"髂腰肌、腹橫肌、骨盆穩定","description":"躺在可調式仰臥起坐椅上,雙腳勾住桿,手拿槓片手臂伸直舉於胸上方,與身體保持垂直,過程中手部動作都必須維持,身體下放時吸氣,下放到背部接近椅面前停住,不要完全貼平需保持張力,上捲時吐氣,節奏上捲1–1.5 秒>下放 3 秒。","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n死蟲式 4–6 下/側\n低強度捲腹 8–10 下\n主動作輕量／低阻力 1 組","primaryMuscles":["abs"],"secondaryMuscles":["deep_core","hip_flexors"],"history":[]},{"id":"excel-21","large":"上肢","detail":"胸部／推","name":"史密斯臥推","primary":"胸大肌","secondary":"前三角肌、肱三頭肌","description":"仰臥起坐椅調至30度,槓鈴位置落在胸口,把胸挺起來,肩膀穩定不聳肩,手肘直上直下,想像胸部出力","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n空槓／輕重量推 1–2 組","primaryMuscles":["chest"],"secondaryMuscles":["front_delts","triceps"],"history":[]},{"id":"excel-22","large":"下肢","detail":"股四頭肌／膝主導","name":"哈克深蹲","primary":"股四頭肌","secondary":"臀大肌、內收肌群、腿後肌群、核心穩定","description":"面向機器,雙腳與肩同寬或略寬,腳尖微微向外。身體保持挺直,核心收緊,雙手握住把手固定身體。\n吸氣,慢慢彎曲膝蓋往下蹲,髖部向後坐,膝蓋順著腳尖方向彎曲,控制下蹲,要全蹲,腳掌保持踩穩地面、腳跟不離地。\n吐氣,用腳掌踩地,讓臀部與大腿前側一起發力將身體推回起始位置.回到膝蓋接近伸直即可,不要完全鎖死。整個動作保持膝蓋穩定、不內扣，身體不前傾或聳肩。空槓(體感約20kg)。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n高跪姿股直肌伸展 8–10 下/側\n側向深蹲 10 下/側 × 1 組\n主動作空重或輕重量 1–2 組","primaryMuscles":["quads"],"secondaryMuscles":["deep_core","glutes","hamstrings","adductors"],"history":[]},{"id":"excel-23","large":"下肢","detail":"小腿／足踝","name":"哈克深蹲_小腿拉伸","primary":"腓腸肌、比目魚肌","secondary":"足踝活動度、足底筋膜放鬆","description":"後腳跟在踏板外,後腳跟下壓,前掌浮起,停留1秒後回復。12下*2組。","warmup":"踝關節前移活動 10 下/側\n小腿動態伸展 10 下/側\n徒手提踵 15 下 × 1 組\n足底放鬆 30–60 秒/側\n此動作以拉伸／活動度為主，不需做到疲勞","primaryMuscles":["calves"],"secondaryMuscles":["ankle_foot"],"history":[]},{"id":"excel-24","large":"下肢","detail":"內收肌／骨盆穩定","name":"哥本哈根側向核心","primary":"內收肌群","secondary":"側核心、核心抗側屈、臀中肌、骨盆穩定","description":"側棒式姿勢,下側手肘在肩膀正下方撐地,上側腳放在長椅或箱子邊緣、膝蓋伸直,身體成一直線,胸口朝前,下側腳膝蓋彎曲自然垂下。\n吸氣準備,以上側腳內收肌出力,抬起整個軀幹離地,下側腳保持懸空,用腹斜肌與內收肌一起維持骨盆的高度,骨盆保持水平,不前後旋轉。節奏抬起 1 秒>下放控制 2–3 秒（保持張力）","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n內收肌岩石式活動 8–10 下/側\n低強度短槓桿哥本哈根 10–20 秒/側","primaryMuscles":["adductors"],"secondaryMuscles":["obliques","deep_core","glute_med"],"history":[]},{"id":"excel-25","large":"上肢","detail":"手臂／三頭","name":"啞鈴坐姿過頭三頭屈伸","primary":"肱三頭肌","secondary":"核心穩定、肩胛穩定","description":"坐在椅上,背部挺直、核心收緊。單手握啞鈴,手肘指向天花板,啞鈴位於後腦杓後方。用三頭肌伸直,不是甩手,核心收緊,避免腰拱,下放比抬起更慢。吸氣,控制啞鈴慢慢下放,手肘位置固定不外開；吐氣,以肱三頭肌發力將手肘伸直,把啞鈴舉回上方。全程上臂保持穩定,只動手肘關節,不後仰、不聳肩。","warmup":"肩關節環繞 10 下/側 × 1–2 組\n肩關節穿越(PVC Pass-Through) 10 下\n手肘屈伸活動 10–15 下\n輕重量三頭下拉 15 下 × 1–2 組","primaryMuscles":["triceps"],"secondaryMuscles":["deep_core","rotator_cuff"],"history":[]},{"id":"excel-26","large":"上肢","detail":"肩部／中三角","name":"啞鈴側平舉","primary":"中三角肌","secondary":"上斜方肌、肩胛穩定","description":"雙手各拿啞鈴,手臂自然垂在身體兩側,肩膀放鬆、核心收緊。手肘微彎,吐氣時將手臂往兩側平舉至接近肩膀高度,想像用側肩把手抬起,肩膀不聳起。到頂端停頓一下後,吸氣慢慢控制下放回起始位置。\n動作過程中保持身體穩定,不前後晃動,也不要用甩的方式抬起。重點是感受三角肌中束出力,而不是用慣性帶起重量。","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n彈力帶拉開 12–15 下\n輕重量目標動作 1–2 組","primaryMuscles":["side_delts"],"secondaryMuscles":["traps","rotator_cuff"],"history":[]},{"id":"excel-27","large":"上肢","detail":"手臂／三頭","name":"單手繩索三頭肌下拉","primary":"肱三頭肌","secondary":"前臂、核心穩定","description":"面對滑輪站立,單手抓住繩索一側（蛋蛋繩）,另一手抓這架子。手肘貼近身體固定,前臂從約 90° 開始。吐氣，用三頭肌把繩索往下壓到手臂接近伸直、靠近大腿。吸氣，控制回到起始位置。重點是 手肘不前後晃動,只動前臂。","warmup":"肩關節環繞 10 下/側 × 1–2 組\n肩關節穿越(PVC Pass-Through) 10 下\n手肘屈伸活動 10–15 下\n輕重量三頭下拉 15 下 × 1–2 組","primaryMuscles":["triceps"],"secondaryMuscles":["forearms","deep_core"],"history":[]},{"id":"excel-28","large":"下肢","detail":"臀部／髖穩定","name":"單腳板凳臀橋","primary":"臀大肌","secondary":"腿後肌群、臀中肌、核心穩定、骨盆穩定","description":"一腳放在板凳上，另一腳抬起懸空，利用支撐腳的臀部把骨盆往上頂，再慢慢放下。這個版本對單側臀大肌、骨盆穩定、核心抗旋轉要求更高，也更容易看出左右差異。\n重點是骨盆不要歪、不要靠腰硬撐。若抬到頂點時骨盆會旋轉、腿後側抽很兇，代表目前難度偏高，可以先回雙腳版","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n臀橋 10–12 下 × 1 組\n側臥髖外展或蚌殼式 10–12 下/側","primaryMuscles":["glutes"],"secondaryMuscles":["deep_core","glute_med","hamstrings"],"history":[]},{"id":"excel-29","large":"下肢","detail":"股四頭肌／膝主導","name":"單腳腿部伸展機","primary":"股四頭肌","secondary":"股內側肌、膝關節穩定","description":"壓腳背的卡榫調整到1,腳背在加個約5cm墊子,讓發力行程到最大,後背貼著椅背。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n高跪姿股直肌伸展 8–10 下/側\n側向深蹲 10 下/側 × 1 組\n主動作空重或輕重量 1–2 組","primaryMuscles":["quads"],"secondaryMuscles":[],"history":[]},{"id":"excel-30","large":"下肢","detail":"股四頭肌／膝主導","name":"單腳腿部伸展機(腳掌外八練內側)","primary":"股四頭肌，偏股內側肌","secondary":"膝關節穩定、核心穩定","description":"後背貼著椅背,壓腳背的卡榫調整到1,腳背在加個約5cm墊子,讓發力行程到最大,腳掌向外側45度轉,過程中感受大腿股內側斜肌發力。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n高跪姿股直肌伸展 8–10 下/側\n側向深蹲 10 下/側 × 1 組\n主動作空重或輕重量 1–2 組","primaryMuscles":["quads"],"secondaryMuscles":["deep_core"],"history":[]},{"id":"excel-31","large":"下肢","detail":"內收肌／骨盆穩定","name":"坐姿滑輪下拉","primary":"內收肌群","secondary":"側核心、臀中肌、骨盆穩定","description":"手抓Cable握把,坐在椅上,抬頭挺胸、手肘微微內收、肩膀穩定不聳肩。吸氣,以背肌帶動手肘往下拉；吐氣,控制放回起始位置。重點是用背拉,不是用手拉。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n內收肌岩石式活動 8–10 下/側\n低強度短槓桿哥本哈根 10–20 秒/側","primaryMuscles":["adductors"],"secondaryMuscles":["obliques","deep_core","glute_med"],"history":[]},{"id":"excel-32","large":"上肢","detail":"背部／拉","name":"坐姿滑輪划船","primary":"闊背肌、中下斜方肌、菱形肌","secondary":"後三角肌、肱二頭肌、前臂、核心穩定","description":"手抓Cable握把,坐在椅上,骨盆前傾、胸口打開,肩膀穩定不聳肩。吸氣,以背肌帶動手肘往後拉,手臂彎曲至約 90°；吐氣,控制放回起始位置。重點是用背拉,不是用手拉","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n肩胛後收練習 10 下\n輕重量划船或下拉 1–2 組","primaryMuscles":["traps","upper_back"],"secondaryMuscles":["rear_delts","biceps","forearms","deep_core"],"history":[]},{"id":"excel-33","large":"下肢","detail":"後鏈／髖主導","name":"坐姿腿彎曲機","primary":"腿後肌群","secondary":"腓腸肌、骨盆穩定、核心穩定","description":"調整座椅位置,使膝關節對齊機器旋轉軸。椅背調整到讓大腿中段被靠墊壓住,不要壓到膝蓋。腳跟下方滾筒位置調到最高點,腳掌微微內八。背部貼椅背、脊椎中立,手握把固定身體。吐氣,用腿後側發力把滾筒往屁股方向拉。吸氣,慢慢伸直,不要讓槓片完全碰底,保持張力。節奏抬起1 秒>底部停1 秒>下放2–3 秒","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n主動作輕重量 1–2 組","primaryMuscles":["hamstrings"],"secondaryMuscles":["deep_core","calves"],"history":[]},{"id":"excel-34","large":"上肢","detail":"背部／拉","name":"引體向上","primary":"闊背肌","secondary":"肱二頭肌、肱肌、下斜方肌、菱形肌、核心穩定","description":"先欲拉一點讓肩膀有空間向後轉穩定,挺胸微微後傾,手握90度位置(約大拇指對齊寬把手轉折處)。","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n肩胛後收練習 10 下\n輕重量划船或下拉 1–2 組","primaryMuscles":[],"secondaryMuscles":["traps","biceps","upper_back","deep_core"],"history":[]},{"id":"excel-35","large":"下肢","detail":"單腳穩定","name":"保加利亞分腿蹲(後腳抬高蹲)","primary":"臀大肌、股四頭肌","secondary":"內收肌群、臀中肌、核心穩定、骨盆穩定","description":"前腳踩穩,前腳膝蓋大約在腳踝上方,後腳放在滾筒架或椅子上,抬頭挺胸、核心收緊、髖骨朝前、骨盆微微前傾,重心放在前腳。\n蹲下時,膝蓋保持在腳踝上方,上半身前傾但脊椎保持中立,以「往後坐」的方式下蹲,感受前腳臀肌與腿後側的拉伸,前腳膝蓋方向對準第 2–3 趾,不要內扣。\n站起時吐氣,想像用前腳臀肌把身體推回,回到起始姿勢的位置,不要完全站直卸力。\n節奏下放3秒>起立1-2秒","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n單腳站姿平衡 20–30 秒/側\n徒手分腿蹲 8 下/側","primaryMuscles":["glutes","quads"],"secondaryMuscles":["deep_core","glute_med","adductors"],"history":[]},{"id":"excel-36","large":"綜合","detail":"全身／體能","name":"戰繩","primary":"肩膀、上背、核心穩定、心肺","secondary":"肩胛穩定、臀腿穩定、握力","description":"主要訓練肩膀、上背、核心與心肺。重點是膝蓋微彎、核心收穩，用肩膀和手臂帶動，但身體不要亂晃","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n戰繩低強度 20–30 秒 × 1 組","primaryMuscles":["upper_back","deep_core"],"secondaryMuscles":["forearms","rotator_cuff"],"history":[]},{"id":"excel-37","large":"核心","detail":"腹部／屈曲","name":"捲腹核心訓練","primary":"腹直肌","secondary":"腹橫肌、骨盆穩定、下腹控制","description":"躺在可調式仰臥起坐椅上,雙腳勾住桿、手放大腿、背懸空。嘴巴吐氣時慢慢捲腹,手指伸到膝蓋,鼻子吸氣慢慢放下,手掌貼著滑回大腿,注意背保持懸空。","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n死蟲式 4–6 下/側\n低強度捲腹 8–10 下\n主動作輕量／低阻力 1 組","primaryMuscles":["abs"],"secondaryMuscles":["deep_core"],"history":[]},{"id":"excel-38","large":"核心","detail":"核心／下腹控制","name":"斜板反向捲腹接雨刷","primary":"腹直肌下段、腹橫肌、腹斜肌","secondary":"髂腰肌、骨盆後傾控制、核心抗旋轉","description":"躺在可調式仰臥起坐椅上,椅面調至 15°,頭靠在把手位置,雙手穩定抓住把手,上背貼合椅墊,核心收緊,雙腳併攏、打直並懸空。\n吐氣,以腹部發力將雙腳向上捲向胸前,重點是骨盆後傾,而不是單純抬腿,捲至腹部維持彎曲張力的位置後,保持捲腹狀態。\n在腹部持續出力下,雙腳一起做 左右小幅擺動,訓練腹斜肌控制旋轉,擺動過程中上背保持貼墊、骨盆不左右晃動、腰椎不拱不塌。\n完成擺動後,雙腳回正,吸氣,控制下放,慢慢讓下背貼回椅墊,雙腳全程懸空不碰地,保持腹部張力。\n節奏捲腹1–2 秒>雨刷左右各 1 秒>下放2–3 秒,間休 1 分鐘。 10 下/側*3組","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n死蟲式 4–6 下/側\n反向捲腹小幅度 6–8 下\n保持下背穩定，不要用腰代償","primaryMuscles":["abs","obliques","deep_core"],"secondaryMuscles":["hip_flexors"],"history":[]},{"id":"excel-39","large":"上肢","detail":"胸部／推","name":"斜槓伏地挺身","primary":"胸大肌","secondary":"前三角肌、肱三頭肌、核心穩定","description":"槓鈴固定在架上,高度約在下方肋骨。雙手抓槓,握距約手肘彎曲 90° 的寬度。雙腳往後站,站的位置是下放時,槓鈴落在兩乳頭連線與肩胛骨中間。身體從頭到腳呈一直線,核心收緊。下放吸氣,手肘彎曲,身體整體往前下方移動。胸口朝向槓鈴,下放至胸口輕碰槓鈴。肩膀保持穩定,不聳肩、不塌腰。推起吐氣,以胸部出力將身體推回起始位置。推起過程中肩胛骨自然靠攏。身體保持一直線,回到手臂伸直但不鎖死","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n空槓／輕重量推 1–2 組","primaryMuscles":["chest"],"secondaryMuscles":["front_delts","triceps","deep_core"],"history":[]},{"id":"excel-40","large":"下肢","detail":"後鏈／髖主導","name":"板凳抬腳臀橋","primary":"臀大肌、腿後肌群","secondary":"核心穩定、骨盆穩定、臀中肌","description":"仰躺在地上，雙腳跟放在板凳上，身體先維持一直線，接著用臀部發力把骨盆往上推，到頂點時臀部收緊，再控制放回原本位置。重點是用臀推髖，不是用下背去拱，肋骨收好、核心有張力，過程中大腿後側會參與，但主力應該是臀大肌。\n確保每一下頂到最高時都還是臀部在出力,不可用下背代償。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n主動作輕重量 1–2 組","primaryMuscles":["glutes","hamstrings"],"secondaryMuscles":["deep_core","glute_med"],"history":[]},{"id":"excel-41","large":"下肢","detail":"股四頭肌／膝主導","name":"槓鈴深蹲","primary":"臀大肌、股四頭肌","secondary":"內收肌群、腿後肌群、核心穩定、下背穩定","description":"雙腳與肩同寬、腳尖自然外轉,腳跟墊斜板。小拇指對到槓鈴上兩道刻痕的內側刻痕,肩胛微收、核心收緊、脊椎保持中立。下蹲吸氣,膝蓋方向對準第2–3腳趾,下蹲到底不硬壓；起身吐氣,想像腳把地板踩破,臀部與股四頭一起發力,膝蓋不打直到位保持張力。節奏：蹲下 2–3 秒> 底部不反彈> 起身 1–2 秒","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n高跪姿股直肌伸展 8–10 下/側\n側向深蹲 10 下/側 × 1 組\n主動作空重或輕重量 1–2 組","primaryMuscles":["glutes","quads"],"secondaryMuscles":["deep_core","lower_back","hamstrings","adductors"],"history":[]},{"id":"excel-42","large":"下肢","detail":"股四頭肌／膝主導","name":"深蹲","primary":"臀大肌、股四頭肌","secondary":"內收肌群、腿後肌群、核心穩定、下背穩定","description":"後腳跟稍微墊高(可墊小槓片),蹲下時吸氣,髖/膝協同發力,不要由膝先帶動就好,全蹲到底,膝蓋可超過腳尖,少量骨盆後傾可接受。起立時吐氣,踝/膝/髖協同發力,想像把地板向下踩開站起,頂端膝蓋保持微彎。第一組8下,第二組10下,第三組","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n高跪姿股直肌伸展 8–10 下/側\n側向深蹲 10 下/側 × 1 組\n主動作空重或輕重量 1–2 組","primaryMuscles":["glutes","quads"],"secondaryMuscles":["deep_core","lower_back","hamstrings","adductors"],"history":[]},{"id":"excel-43","large":"下肢","detail":"後鏈／髖主導","name":"硬舉","primary":"臀大肌、腿後肌群","secondary":"豎脊肌、上背穩定、核心穩定、握力","description":"雙腳與髖同寬，腳掌平行或微外，骨盆維持中立、胸口自然打開、核心收緊。\n由髖折啟動，髖部往後推、膝蓋微彎不主動前移，背部保持中立，感受腿後側被拉長。\n到膝下後拉起，吸氣撐住核心，用腳踩地，臀部與腿後側一起出力站直，下放時控制速度。\n硬舉是「用髖折把重量從地面帶起」的後鏈動作，重點在臀與腿後側，而不是下背硬拉。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n主動作輕重量 1–2 組","primaryMuscles":["glutes","hamstrings"],"secondaryMuscles":["forearms","upper_back","deep_core"],"history":[]},{"id":"excel-44","large":"上肢","detail":"手臂／三頭","name":"繩索三頭肌下拉","primary":"肱三頭肌","secondary":"前臂、核心穩定","description":"手肘固定，利用三頭肌將繩索由胸前下拉至手臂伸直、靠近臀側。","warmup":"肩關節環繞 10 下/側 × 1–2 組\n肩關節穿越(PVC Pass-Through) 10 下\n手肘屈伸活動 10–15 下\n輕重量三頭下拉 15 下 × 1–2 組","primaryMuscles":["triceps"],"secondaryMuscles":["forearms","deep_core"],"history":[]},{"id":"excel-45","large":"上肢","detail":"手臂／三頭","name":"繩索過頭三頭肌伸展","primary":"肱三頭肌","secondary":"核心穩定、肩胛穩定","description":"手肘固定在頭側，將繩索由後腦位置向上伸直手臂，訓練三頭肌。1組12下。)\n以上側躺前平舉、繩索三頭肌下拉、繩索過頭三頭肌伸展連續做一輪為一大組,共做3大組","warmup":"肩關節環繞 10 下/側 × 1–2 組\n肩關節穿越(PVC Pass-Through) 10 下\n手肘屈伸活動 10–15 下\n輕重量三頭下拉 15 下 × 1–2 組","primaryMuscles":["triceps"],"secondaryMuscles":["deep_core","rotator_cuff"],"history":[]},{"id":"excel-46","large":"下肢","detail":"後鏈／髖主導","name":"羅馬椅","primary":"臀大肌、腿後肌群","secondary":"豎脊肌、核心穩定、骨盆穩定","description":"初期在椅子左右前腳各墊兩片小槓片,降低角度以便控制動作。調整大腿靠墊高度,使髖骨兩側不被壓迫。雙膝微彎、收緊核心、上半身抬頭挺胸。彎下時吸氣,感受臀後側與腿後肌被拉緊；抬起時吐氣,以臀部發力、屁股夾緊,想像「往前推髖」讓上半身抬至與腿平行即可,避免過高造成腰椎代償。節奏抬起2秒>下放3秒","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n主動作輕重量 1–2 組","primaryMuscles":["glutes","hamstrings"],"secondaryMuscles":["deep_core"],"history":[]},{"id":"excel-47","large":"核心","detail":"核心／側屈控制","name":"羅馬椅側腹訓練","primary":"腹外斜肌、腹內斜肌、腰方肌","secondary":"豎脊肌、臀中肌、骨盆穩定","description":"以剪刀腳姿勢卡在槓桿下,下方腳在前,側邊靠在兩個靠墊中間,下方手放在對側肋骨,上方手輕扶後腦勺,保持胸口朝前。下彎時吸氣慢慢下,想像用下方的肋骨往骨盆方向靠近,並感受對向側腹與肋骨的拉伸,回正時吐氣,回到身體成一直線即可,過程中身體保持在同一平面上。節奏下彎3秒>回正1秒。","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n半跪姿胸椎旋轉 10 下/側\n側棒式短時間啟動 15–20 秒/側\nPallof Press 8–10 下/側","primaryMuscles":[],"secondaryMuscles":["deep_core","glute_med"],"history":[]},{"id":"excel-48","large":"核心","detail":"核心／抗伸展","name":"腳放板凳平板撐","primary":"腹橫肌、腹直肌、核心抗伸展","secondary":"前鋸肌、肩胛穩定、髖部穩定","description":"注意不可腰塌、屁股翹太高、肩膀聳起來,一旦開始腰痠、骨盆前傾、下背撐住，就該停了。","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n死蟲式 4–6 下/側\n低強度平板撐 20–30 秒\n確認肋骨下收、骨盆不前傾","primaryMuscles":["abs","deep_core"],"secondaryMuscles":["rotator_cuff"],"history":[]},{"id":"excel-49","large":"核心","detail":"腹部／屈曲","name":"腹肌訓練機","primary":"腹直肌","secondary":"腹橫肌、髂腰肌、骨盆穩定","description":"在腹肌訓練機上,上半身固定,雙腳夾3kg啞鈴,懸空抬腿,腿要打直做下腹核心訓練","warmup":"骨盆調整 6 次\n全呼吸練習 6 次\n死蟲式 4–6 下/側\n低強度捲腹 8–10 下\n主動作輕量／低阻力 1 組","primaryMuscles":["abs"],"secondaryMuscles":["deep_core","hip_flexors"],"history":[]},{"id":"excel-50","large":"下肢","detail":"股四頭肌／膝主導","name":"腿推機","primary":"股四頭肌","secondary":"臀大肌、內收肌群、腿後肌群、核心穩定","description":"椅背調到最底,腳掌踩在踏板斜邊切齊,讓彎腿動作有最大的空間不卡住,背部增加靠墊,讓彎曲角度更大,腳伸直時吐氣,膝蓋保持微彎。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n高跪姿股直肌伸展 8–10 下/側\n側向深蹲 10 下/側 × 1 組\n主動作空重或輕重量 1–2 組","primaryMuscles":["quads"],"secondaryMuscles":["deep_core","glutes","hamstrings","adductors"],"history":[]},{"id":"excel-51","large":"下肢","detail":"股四頭肌／膝主導","name":"腿部伸展機","primary":"股四頭肌","secondary":"股內側肌、膝關節穩定","description":"壓腳背的卡榫調整到1,讓發力行程到最大,後背貼著椅背,負重9kg,腿慢慢伸直(1秒),嘴巴吐氣\"斯~\",腳背要出力勾著,腳慢慢放下(3秒),鼻子吸氣,注意不要全放到負重空掉,要保持張力。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n高跪姿股直肌伸展 8–10 下/側\n側向深蹲 10 下/側 × 1 組\n主動作空重或輕重量 1–2 組","primaryMuscles":["quads"],"secondaryMuscles":[],"history":[]},{"id":"excel-52","large":"下肢","detail":"臀部／髖穩定","name":"臀中肌外展機","primary":"臀中肌、臀小肌","secondary":"深層外旋肌、骨盆穩定、核心穩定","description":"坐在機器上,背後再放個墊靠墊壤身體往前一點,讓兩側靠墊貼在大腿中段外側。\n起始時雙腿併攏或微開,出力時把雙腿往外打開,打開後停 1 秒,讓臀部外側出力,再慢慢回到起始位置,不要直接放掉","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n臀橋 10–12 下 × 1 組\n側臥髖外展或蚌殼式 10–12 下/側","primaryMuscles":["glute_med"],"secondaryMuscles":["deep_core"],"history":[]},{"id":"excel-53","large":"下肢","detail":"後鏈／腿後肌","name":"臥姿腿部彎曲機","primary":"腿後肌群","secondary":"腓腸肌、骨盆穩定、核心穩定","description":"膝蓋處卡榫調至1讓可彎行程最大,膝蓋在靠墊下方只支撐股直肌,避免影響膝蓋活動,","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n腿後彎曲輕重量 12–15 下 × 1 組","primaryMuscles":["hamstrings"],"secondaryMuscles":["deep_core","calves"],"history":[]},{"id":"excel-54","large":"上肢","detail":"胸部／推","name":"自由槓鈴臥推","primary":"胸大肌","secondary":"前三角肌、肱三頭肌、核心穩定","description":"眼睛位於槓鈴正下方。握距調整到槓鈴下放時前臂接近垂直。控制槓鈴下放至下胸或乳頭線附近,肩膀保持穩定不前滑。下放速度要慢且可控。吐氣推起槓鈴,想像用胸部把重量推開,手臂接近伸直即可,不鎖死、不聳肩。","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n空槓／輕重量推 1–2 組","primaryMuscles":["chest"],"secondaryMuscles":["front_delts","triceps","deep_core"],"history":[]},{"id":"excel-55","large":"下肢","detail":"後鏈／腿後肌","name":"跪姿腿後勾機(單腳)","primary":"腿後肌群","secondary":"腓腸肌、髖部穩定、骨盆穩定、核心穩定","description":"腿後勾至水平即可。負重一邊掛10kg。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n徒手髖鉸鍊 10 下\n臀橋 10–12 下 × 1 組\n腿後彎曲輕重量 12–15 下 × 1 組","primaryMuscles":["hamstrings"],"secondaryMuscles":["deep_core","calves"],"history":[]},{"id":"excel-56","large":"下肢","detail":"單腳穩定","name":"雙手持啞鈴弓箭步行走","primary":"腹直肌、腹橫肌","secondary":"內收肌群、臀中肌、核心穩定、骨盆穩定、足踝穩定","description":"雙手各拿 6 kg 啞鈴自然放在身體兩側，抬頭挺胸、核心收緊，往前跨一步後下蹲，前腳全腳掌踩穩、膝蓋對準腳尖方向，後腳跟自然抬起；再用前腳發力把身體帶起並順勢往前走，左右腳交替前進。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n單腳站姿平衡 20–30 秒/側\n徒手分腿蹲 8 下/側","primaryMuscles":["abs","deep_core"],"secondaryMuscles":["glute_med","adductors","ankle_foot"],"history":[]},{"id":"excel-57","large":"下肢","detail":"後鏈／髖主導","name":"高滑輪弓箭步旋轉髖鉸鍊","primary":"臀大肌、腿後肌群","secondary":"臀中肌、內收肌群、足踝穩定、核心抗旋轉、骨盆穩定","description":"身體側對高滑輪站弓箭步,前腳在外側,雙手抓繩索在胸前保持張力,外側手正握,另一手反握,往下時以前腳做髖主導下沉,像單側 RDL 那樣讓臀部往後坐,前腳膝蓋保持在腳踝上方,同時帶一點軀幹與手部的斜向旋轉；回來時以前腳臀部發力,把身體帶回起始位置,重點感受前腳臀肌和內收肌穩定出力。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n單腳站姿平衡 20–30 秒/側\n半跪姿胸椎旋轉 10 下/側\n徒手髖鉸鍊 10 下","primaryMuscles":["glutes","hamstrings"],"secondaryMuscles":["deep_core","glute_med","adductors","ankle_foot"],"history":[]},{"id":"excel-58","large":"上肢","detail":"背部／拉","name":"龜背划船","primary":"中下斜方肌、菱形肌、闊背肌","secondary":"後三角肌、肱二頭肌、前臂肌群、核心穩定","description":"坐在訓練椅上,雙腳踩穩踏板,雙手握住把手。起始姿勢時胸口微微內收、上背稍微圓背,肩膀自然往前伸展,讓背部有拉開的感覺。\n吸氣準備,先將肩胛骨往後收,再用背部帶動手肘往後拉,把把手拉向肚臍或下胸位置。過程中保持身體穩定,不要用身體後仰借力。\n拉到最後時，背部用力夾緊 1 秒，感受中背與菱形肌收縮。吐氣慢慢控制放回，讓肩胛骨再次往前展開，背部保持張力。","warmup":"肩關節環繞 10 下/側 × 2 組\n肩關節穿越(PVC Pass-Through) 10 下\n長棍肩關節繞環(PVC Around the World) 6–8 下\n半跪姿胸椎旋轉 10 下/側 × 1 組\n肩胛後收練習 10 下\n輕重量划船或下拉 1–2 組","primaryMuscles":["traps","upper_back"],"secondaryMuscles":["rear_delts","biceps","forearms","deep_core"],"history":[]},{"id":"excel-59","large":"上肢","detail":"胸部／推","name":"斜 15 度啞鈴胸推","primary":"胸大肌上束","secondary":"前三角肌、肱三頭肌","description":"躺在 15 度上斜椅，雙手各持 6 kg 啞鈴，感受握力平均分布在大拇指球與小拇指球，前臂以穩定支撐為主，不刻意用手腕或前臂硬推。由胸側上方將啞鈴穩定推起，再控制下放回起始位置，手肘略在身體前方，不要過度外開。","warmup":"肩關節活動度熱身：作為上肢訓練前暖身，重點放在肩關節活動、肩胛控制與上背啟動。\nY Raise：主要訓練下斜方肌、後三角與肩胛穩定肌群，作為上背喚醒動作。彈力繩以臀部壓住固定，雙手抓住兩端往斜前上方抬起呈 Y 字，過程中肩膀下沉、手往遠處伸長，不要聳肩借力。","primaryMuscles":["chest"],"secondaryMuscles":["front_delts","triceps"],"history":[]},{"id":"excel-60","large":"上肢","detail":"背部／拉","name":"Cable 單手划船","primary":"闊背肌、中下斜方肌、菱形肌","secondary":"後三角肌、肱二頭肌、前臂肌群、核心穩定","description":"單手抓握把，胸口打開，坐姿穩定，雙腳一前一側支撐，將手肘往後拉向身體側邊，但不要拉超過身體後方，再控制回放。","warmup":"肩關節活動度熱身：作為上肢訓練前暖身，重點放在肩關節活動、肩胛控制與上背啟動。\nY Raise：主要訓練下斜方肌、後三角與肩胛穩定肌群，作為上背喚醒動作。彈力繩以臀部壓住固定，雙手抓住兩端往斜前上方抬起呈 Y 字，過程中肩膀下沉、手往遠處伸長，不要聳肩借力。","primaryMuscles":["traps","upper_back"],"secondaryMuscles":["rear_delts","biceps","forearms","deep_core"],"history":[]},{"id":"excel-61","large":"上肢","detail":"肩部／中三角","name":"單手中三角啞鈴側平舉","primary":"三角肌中束","secondary":"上斜方肌、肩袖穩定、肩胛穩定","description":"身體側邊靠著椅背，另一手持 3 kg 啞鈴，肩膀固定、手打直、手腕上折，將手臂往側邊抬至接近肩高，平順抬起，不要甩起來，再慢慢控制放下。","warmup":"肩關節活動度熱身：作為上肢訓練前暖身，重點放在肩關節活動、肩胛控制與上背啟動。\nY Raise：主要訓練下斜方肌、後三角與肩胛穩定肌群，作為上背喚醒動作。彈力繩以臀部壓住固定，雙手抓住兩端往斜前上方抬起呈 Y 字，過程中肩膀下沉、手往遠處伸長，不要聳肩借力。","primaryMuscles":[],"secondaryMuscles":["traps","rotator_cuff"],"history":[]},{"id":"excel-62","large":"上肢","detail":"手臂／二頭","name":"45 度斜板啞鈴二頭彎舉＋站立二頭彎舉","primary":"肱二頭肌","secondary":"肱肌、肱橈肌、前臂肌群","description":"先做 45 度斜板啞鈴二頭彎舉，接著立刻做站立二頭彎舉 ，兩個動作合併算 1 組，共 2 組，過程中手肘盡量固定，不要明顯後仰借力。","warmup":"肩關節活動度熱身：作為上肢訓練前暖身，重點放在肩關節活動、肩胛控制與上背啟動。\nY Raise：主要訓練下斜方肌、後三角與肩胛穩定肌群，作為上背喚醒動作。彈力繩以臀部壓住固定，雙手抓住兩端往斜前上方抬起呈 Y 字，過程中肩膀下沉、手往遠處伸長，不要聳肩借力。","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"history":[]},{"id":"excel-63","large":"上肢","detail":"胸部／推","name":"平板啞鈴臥推","primary":"胸大肌、前三角肌","secondary":"肱三頭肌、核心穩定","description":"先坐在訓練椅上，將啞鈴放在大腿上，再順勢躺下至平板位置，肩胛穩定、胸口自然打開。雙手將啞鈴推至胸前上方，握力適中，啞鈴成外八，感受重量平均分布在大拇指球與小拇指球，手腕保持穩定。吸氣時慢慢下放，手肘自然向外下方打開，前臂大致維持垂直地面，下放至肩膀仍穩定、約接近胸口上方的位置即可；吐氣時以胸肌發力將啞鈴推回起始位置。","warmup":"肩關節活動度熱身\n肩關節環繞：10 下/側 × 2 組。\n肩關節穿越(PVC Pass-Through)\n長棍肩關節繞環(PVC Around the World)\nY Raise 彈力繩以臀部壓住固定，雙手抓住兩端往斜前上方抬起呈 Y 字，過程中肩膀下沉、手往遠處伸長，不要聳肩借力。","primaryMuscles":["chest","front_delts"],"secondaryMuscles":["triceps","deep_core"],"history":[]},{"id":"excel-64","large":"上肢","detail":"背部／拉","name":"Cable 中立握下拉","primary":"闊背肌、圓背肌","secondary":"肱二頭肌、前臂、下斜方肌、菱形肌","description":"使用掌心相對的寬握把，坐穩後讓大腿固定，胸口自然打開，肩膀下沉穩定，軀幹後傾10~15度，不要過度後仰。吐氣時以背肌發力，將握把往上胸前拉下，手肘朝下往後收，不要聳肩；吸氣時再慢慢控制回放至起始位置。","warmup":"肩關節活動度熱身\n肩關節環繞：10 下/側 × 2 組。\n肩關節穿越(PVC Pass-Through)\n長棍肩關節繞環(PVC Around the World)\nY Raise 彈力繩以臀部壓住固定，雙手抓住兩端往斜前上方抬起呈 Y 字，過程中肩膀下沉、手往遠處伸長，不要聳肩借力。","primaryMuscles":[],"secondaryMuscles":["traps","biceps","forearms","upper_back"],"history":[]},{"id":"excel-65","large":"上肢","detail":"胸部／推","name":"15 度上斜啞鈴飛鳥","primary":"胸大肌上束、前三角肌","secondary":"前鋸肌、核心穩定","description":"將訓練椅調至 15 度後躺上，肩胛穩定、胸口自然打開。雙手持啞鈴舉在胸前上方，掌心相對，手打直不鎖死。吸氣時雙手沿弧線慢慢向兩側打開，下放至胸肌有伸展感且肩膀仍穩定的位置即可；吐氣時以胸肌夾回到起始位置。過程中手肘角度固定，不要完全打直，也不要下放過深。","warmup":"肩關節活動度熱身\n肩關節環繞：10 下/側 × 2 組。\n肩關節穿越(PVC Pass-Through)\n長棍肩關節繞環(PVC Around the World)\nY Raise 彈力繩以臀部壓住固定，雙手抓住兩端往斜前上方抬起呈 Y 字，過程中肩膀下沉、手往遠處伸長，不要聳肩借力。","primaryMuscles":["chest","front_delts"],"secondaryMuscles":["deep_core"],"history":[]},{"id":"excel-66","large":"上肢","detail":"手臂／二頭","name":"75 度斜板站姿二頭彎舉遞減組","primary":"肱二頭肌","secondary":"肱肌、前臂群","description":"將訓練椅調至約 75 度，並加上靠墊，讓身體站姿靠穩，減少晃動與借力。雙手持啞鈴進行二頭彎舉，過程中手肘盡量固定在身體兩側，不要明顯聳肩或後仰。先以較大重量完成 6 下，再立刻換較小重量完成 6 下，兩段合併算 1 組，利用遞減組延長張力時間，將剩餘力量持續做到接近力竭。","warmup":"肩關節活動度熱身\n肩關節環繞：10 下/側 × 2 組。\n肩關節穿越(PVC Pass-Through)\n長棍肩關節繞環(PVC Around the World)\nY Raise 彈力繩以臀部壓住固定，雙手抓住兩端往斜前上方抬起呈 Y 字，過程中肩膀下沉、手往遠處伸長，不要聳肩借力。","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"history":[]},{"id":"excel-67","large":"上肢","detail":"胸部／推","name":"坐姿 75 度 Cable 夾胸","primary":"胸大肌上束","secondary":"前三角肌、前鋸肌","description":"坐在 75 度斜板上，雙手各握一側 Cable，肩膀穩定、手肘微彎，沿弧線將雙手往胸前夾回，再慢慢控制打開，重點感受上胸收縮，不要聳肩或用身體借力。","warmup":"臀橋夾磚呼吸10下\n四足跪姿手肘撐地深呼吸10下\n側平板轉體呼吸10下/側\n肩關節活動度熱身：作為上肢訓練前暖身，重點放在肩關節活動、肩胛控制與上背啟動。","primaryMuscles":["chest"],"secondaryMuscles":["front_delts"],"history":[]},{"id":"excel-68","large":"上肢","detail":"胸部／推","name":"弓箭步地雷管推舉","primary":"胸大肌、前三角肌","secondary":"三頭肌、核心、側核心、前鋸肌","description":"採弓箭步站姿，通常是推的那一側腳在後，身體微微前傾。槓鈴端放在胸口或肩膀前方，手肘約 45 度，不要外開太多。另一手可自然下垂，或輕放在對側肋骨／腰側，幫助穩定核心。\n核心收緊、肋骨不要外翻，前腳踩穩。將槓鈴沿斜上方推出去，推到手臂接近伸直即可，不要完全鎖死手肘。再控制速度收回到胸口前方，不要讓肩膀被往前拉走。重點是：不是用腰去頂，也不是聳肩硬推，而是胸部、前三角肌、三頭肌一起出力，核心穩住身體不要旋轉。","warmup":"","primaryMuscles":["chest","front_delts"],"secondaryMuscles":["triceps","obliques"],"history":[]},{"id":"excel-69","large":"核心","detail":"核心／旋轉控制","name":"半跪姿 Cable 斜上拉","primary":"腹斜肌、腹橫肌、豎脊肌","secondary":"臀穩定、肩胛穩定、前鋸肌","description":"採半跪姿，一腳踩地、一膝跪地，身體側對 Cable。雙手握住短把手或繩索把手，手臂伸直於身體前方，身體與 Cable 力線約呈 90 度。\n若 Cable 在右側，起始位置在右下方，核心收緊、肋骨不要外翻、骨盆保持穩定。吐氣時將把手由右下方斜拉到左上方，動作類似網球反手回擊；吸氣時控制回到右下方。過程中手臂接近伸直但不要鎖死手肘，主要感受腹斜肌、側核心、胸椎旋轉與肩胛活動。避免髖部跟著旋轉，也不要用腰椎硬扭或聳肩硬拉。\n影片：https://youtube.com/shorts/aU7NvHS8AoA?si=Gh_OrhnFairGVmWl","warmup":"","primaryMuscles":["obliques","deep_core"],"secondaryMuscles":["rotator_cuff"],"history":[]},{"id":"excel-70","large":"下肢","detail":"臀部","name":"扶椅 Cable 單腳 RDL 髖旋轉","primary":"臀大肌、臀中肌","secondary":"腿後肌群、內收肌、核心、髖穩定","description":"一手扶著約 90 度的訓練椅椅背，另一手握 Cable 把手。站立腳踩穩，另一腳向後抬起，身體做髖折，維持背部平直。\n進入單腳 RDL 位置後，抬起腳向外打開，讓骨盆與胸口一起往側邊旋轉，視線可跟著身體轉向側邊。接著控制回正，再回到起始位置。\n過程中站立腳膝蓋微彎，髖部往後推，不要彎腰駝背。旋轉時以髖關節與胸椎控制為主，不要用腰椎硬扭。手扶椅背只是輔助平衡，不要把重量壓在手上。","warmup":"","primaryMuscles":["glutes","glute_med"],"secondaryMuscles":["hamstrings","adductors"],"history":[]},{"id":"excel-71","large":"上肢","detail":"手臂／二頭","name":"弓箭步背對 Cable 二頭彎舉","primary":"肱二頭肌","secondary":"肱肌、肱橈肌、前三角肌、核心穩定","description":"低位 Cable，身體背對 Cable，採弓箭步站姿。肩膀固定，手肘略在身體後方，保持上臂穩定不前後晃動。吐氣時做二頭彎舉，將把手往肩膀方向彎起；吸氣時控制下放，感受二頭肌在伸展位受力。過程中不要聳肩、不要後仰，也不要用身體甩重量。\n影片：https://www.youtube.com/watch?v=w8K0OAwrgtA","warmup":"","primaryMuscles":["biceps"],"secondaryMuscles":["front_delts","deep_core"],"history":[]},{"id":"excel-72","large":"下肢","detail":"單腳穩定","name":"啞鈴原地分腿蹲","primary":"臀大肌、股四頭肌","secondary":"內收肌群、臀中肌、腿後肌群、核心與骨盆穩定","description":"採前後分腿站姿，雙腳約保持髖寬，後腳以前腳掌著地、腳跟抬起。骨盆保持朝前，前腳全腳掌穩定踩地。\n吸氣並收緊核心，身體控制向下，後膝朝地面下降，前膝方向與第 2～3 腳趾一致。軀幹可保持直立或由髖部微微前傾，但避免彎腰或腰椎過度拱起。\n下降至後膝接近地面，或前腿大腿接近平行地面，再以前腳為主發力站起。過程中避免前膝內夾、骨盆旋轉，以及重心過度移到後腳。\n節奏可採下降 3 秒、底部停 1 秒、起身 1～2 秒。","warmup":"擺腿熱身 10 下/側\n開髖熱身 6 下/側\n側向深蹲 10 下/側 × 1 組\n單腳站姿平衡 20–30 秒/側\n徒手分腿蹲 8 下/側","primaryMuscles":["glutes","quads"],"secondaryMuscles":["deep_core","glute_med","hamstrings","adductors"],"history":[]},{"id":"excel-73","large":"上肢","detail":"背部／拉","name":"上斜椅啞鈴划船","primary":"闊背肌、菱形肌、中下斜方肌","secondary":"後三角肌、肱二頭肌、肱橈肌","description":"椅背調整約 30–45 度，身體面向椅背，胸口貼穩椅墊，雙手各握啞鈴自然下垂。吐氣時將啞鈴往身體兩側或下肋方向拉起，感受肩胛後收與背部出力；吸氣時控制下放。過程中避免聳肩、抬頭過高、胸口離開椅墊或用身體甩動重量。","warmup":"","primaryMuscles":["traps","upper_back"],"secondaryMuscles":["rear_delts","biceps"],"history":[]},{"id":"excel-74","large":"上肢","detail":"胸部／推","name":"坐姿上斜胸推機","primary":"胸大肌上束、前三角肌","secondary":"肱三頭肌、前鋸肌、核心穩定","description":"坐在胸推機上，背部與肩胛穩定靠住椅背，胸口微挺、肋骨不要過度外翻。雙手握住把手，吐氣時將把手往前上方推至手臂接近伸直，吸氣時控制回到胸前。過程中肩膀不要聳起或前頂，手肘不要完全鎖死，重點感受胸大肌上束、前三角肌與三頭肌出力。第 1 組 很輕 12 下 熱身、找動作；第 2 組 中等偏輕 10 下 確認路徑；第 3–4 組 正式重量 8–10 下 工作組；第 5 組 視狀況可做可不做 8–10 下 狀態好才加。","warmup":"","primaryMuscles":["chest","front_delts"],"secondaryMuscles":["triceps","deep_core"],"history":[]},{"id":"excel-75","large":"上肢","detail":"肩部／穩定","name":"上斜椅俯臥 Y Raise","primary":"下斜方肌、前鋸肌","secondary":"中斜方肌、菱形肌、後三角肌、肩袖肌群","description":"椅背調整約 30–45 度，身體面向椅背，胸口貼穩椅墊，雙手各握輕啞鈴自然下垂。保持肩膀放鬆，手臂往斜前上方舉起，形成 Y 字形。\n\n舉起時感受肩胛往上旋轉與下斜方肌出力，不要聳肩或用腰背代償。手肘可微彎，不需完全鎖死。控制速度下放，維持胸口貼住椅墊。","warmup":"","primaryMuscles":["traps"],"secondaryMuscles":["rear_delts","upper_back","rotator_cuff"],"history":[]},{"id":"excel-76","large":"上肢","detail":"手臂／二頭","name":"站姿 Cable 二頭彎舉","primary":"肱二頭肌","secondary":"肱肌、肱橈肌、前臂屈肌群、核心穩定","description":"站姿面向 Cable，滑輪調至低位，雙手握住把手。核心收緊、身體保持穩定，上臂固定在身體兩側。吐氣時做二頭彎舉，將把手往肩膀方向彎起；吸氣時控制下放至手臂接近伸直。過程中不要聳肩、後仰或用身體甩重量。","warmup":"","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","deep_core"],"history":[]},{"id":"excel-77","large":"上肢","detail":"肩部／前三角","name":"史密斯槓鈴肩推","primary":"前三角肌、肱三頭肌","secondary":"中三角肌、胸大肌上束、核心穩定","description":"訓練椅調至約 80～85 度，肩胛與臀部穩定靠住椅背，胸口微挺、核心收穩，下背維持自然弧度，雙腳踩穩地面。雙手略寬於肩寬握槓，手腕保持穩定，手肘位於身體斜前方約 30～45 度。吸氣時有控制地下放至下巴～上胸附近，吐氣快速推起，過程中避免聳肩、拱腰或反彈借力。","warmup":"","primaryMuscles":["front_delts","triceps"],"secondaryMuscles":["chest","side_delts","deep_core"],"history":[]},{"id":"excel-78","large":"上肢","detail":"肩部／前三角","name":"站姿啞鈴飛鳥","primary":"前三角肌","secondary":"中三角肌、胸大肌上束、核心穩定","description":"雙腳約肩寬站穩,核心收緊、胸口微挺，雙手各持啞鈴，手肘保持微彎固定，從身體兩側沿弧線往前夾至胸前，再慢慢控制打開回原位，過程中不要聳肩、甩動或拱腰借力。","warmup":"","primaryMuscles":["front_delts"],"secondaryMuscles":["chest","side_delts","deep_core"],"history":[]},{"id":"excel-79","large":"上肢","detail":"肩部／後三角","name":"坐姿俯身啞鈴反向飛鳥","primary":"後三角肌","secondary":"菱形肌、中斜方肌、肩袖穩定、豎脊肌","description":"坐姿軀幹微前傾，眼睛看向前下方約45°，雙手持啞鈴自然垂於大腿外側，手肘微彎固定。吸氣穩定軀幹，吐氣時以後肩及肩胛周圍肌群發力，將雙臂向兩側斜後方抬起，再慢慢控制下放；過程中脊椎保持穩定、肩膀遠離耳朵，避免聳肩、抬頭或用腰甩動。","warmup":"","primaryMuscles":["rear_delts"],"secondaryMuscles":["traps","upper_back","rotator_cuff"],"history":[]},{"id":"excel-80","large":"上肢","detail":"胸部／推","name":"伏地挺身","primary":"胸大肌、肱三頭肌、前三角肌","secondary":"前鋸肌、核心穩定","description":"地面放兩個伏地挺身握把，位置約比肩膀略寬，握把可微微呈外八，讓手腕保持自然中立；沒有握把時可用穩定、不會滾動的啞鈴代替。雙手握穩後，頭、背、骨盆到腳跟維持一直線，核心與臀部收緊，避免腹部或腰部塌下，也不要把屁股抬太高。吸氣時有控制地下放，手肘約朝身體斜後方30～45°，胸口往兩個握把中間靠近；吐氣時以胸肌、前三角與肱三頭肌發力推回，頂端讓肩胛自然向外延伸，避免聳肩或伸頭代償。","warmup":"","primaryMuscles":["chest","front_delts","triceps"],"secondaryMuscles":["deep_core"],"history":[]},{"id":"excel-81","large":"上肢","detail":"胸部／推","name":"啞鈴臥推","primary":"胸大肌","secondary":"前三角肌、肱三頭肌、核心穩定","description":"主要訓練胸大肌，次要帶到前三角肌與肱三頭肌。先坐在訓練椅上，將啞鈴放在大腿上，再順勢躺下，肩胛穩定貼住椅背、胸口自然打開、雙腳踩穩地面。雙手持啞鈴在胸口兩側上方，手腕保持穩定，吸氣時有控制地下放，手肘約朝身體斜外側 30～45°，下放到胸肌有拉伸感且肩膀仍穩定的位置；吐氣時以胸肌發力將啞鈴推回上方。過程中不要聳肩、不要過度拱腰，也不要讓啞鈴在頂端互撞。結束時,雙腳抬起來接啞鈴。","warmup":"","primaryMuscles":["chest"],"secondaryMuscles":["front_delts","triceps","deep_core"],"history":[]},{"id":"excel-82","large":"下肢","detail":"後鏈／髖主導","name":"壺鈴擺盪","primary":"臀大肌、腿後肌","secondary":"核心穩定、豎脊肌、前臂群","description":"雙腳約與肩同寬或略寬站立，壺鈴放在身體前方。先將臀部往後推做髖鉸鍊，背部維持中立，將壺鈴帶入雙腿之間；接著快速伸髖並夾緊臀部，利用臀腿爆發力將壺鈴自然帶到胸口附近高度。手臂只負責連接與控制，不主動抬舉。回程時等待壺鈴靠近身體，再將臀部往後送，讓壺鈴重新進入雙腿之間。過程中避免做成深蹲、聳肩、用手甩壺鈴或在頂端過度後仰。","warmup":"","primaryMuscles":["glutes","hamstrings"],"secondaryMuscles":["forearms","deep_core"],"history":[]},{"id":"excel-83","large":"上肢","detail":"背部／拉","name":"高位背下拉訓練機","primary":"闊背肌","secondary":"肱二頭肌、菱形肌、中下斜方肌、後三角肌","description":"坐穩後讓大腿固定，胸口自然打開、核心收緊，雙手握住上方握把。吐氣時先讓肩膀下沉，再用背肌帶動手肘往下、往身體兩側拉，將握把拉到上胸附近；吸氣時慢慢控制回放，讓手臂伸長、闊背肌被拉開。過程中不要聳肩、不要用身體大幅後仰借力，也不要只靠手臂硬拉。","warmup":"","primaryMuscles":[],"secondaryMuscles":[ const MUSCLE_SIMPLIFY_MAP={"neck":"neck","chest":"chest","shoulders":"shoulders","biceps":"biceps","triceps":"triceps","forearms":"forearms","traps":"traps","lats":"lats","abs":"abs","obliques":"obliques","lower_back":"lower_back","hip_flexors":"hip_flexors","glutes":"glutes","hip_abductors":"hip_abductors","quads":"quads","hamstrings":"hamstrings","hip_adductors":"hip_adductors","calves":"calves","front_delts":"shoulders","side_delts":"shoulders","rear_delts":"shoulders","rotator_cuff":"shoulders","upper_back":"traps","back_upper":"lats","core_front":"abs","deep_core":"abs","adductors":"hip_adductors","glute_med":"hip_abductors","quads_front":"quads","arms_hands":"biceps","tibialis":"calves","ankle_foot":"calves"};
function simplifyMuscleIds(list){return [...new Set((list||[]).flatMap(id=>id==="arms_hands"?["biceps","triceps","forearms"]:[MUSCLE_SIMPLIFY_MAP[id]||id]).filter(id=>MUSCLES.some(m=>m.id===id)))];}
function migrateExercises(exercises){(exercises||[]).forEach(e=>{e.primaryMuscles=simplifyMuscleIds(e.primaryMuscles);e.secondaryMuscles=simplifyMuscleIds(e.secondaryMuscles).filter(id=>!e.primaryMuscles.includes(id));});return exercises;}

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){
  // Never display historical records while Firebase is checking authentication.
  if(window.FIREBASE_CONFIG?.projectId){state.exercises=[];state.selectedId=null;return;}
  try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(saved&&Array.isArray(saved.exercises)){state.exercises=migrateExercises(saved.exercises);}else state.exercises=migrateExercises(clone(INITIAL_DATA))}catch(e){state.exercises=migrateExercises(clone(INITIAL_DATA))}
  state.selectedId=state.exercises[0]?.id||null;
}
function save(){
  if(window.CloudTraining?.configured && !window.CloudTraining?.hasUser){
    toast('訪客只能瀏覽共用動作；請先登入才能記錄訓練');
    window.CloudTraining?.onLocalSave?.();
    return;
  }
  if(!window.CloudTraining?.configured){
    localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,updatedAt:new Date().toISOString(),exercises:state.exercises}));
  }
  window.CloudTraining?.onLocalSave?.();
}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),1800)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function linkify(s=''){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function nl(s=''){return linkify(s).replace(/\n/g,'<br>')}
function getSelected(){return state.exercises.find(x=>x.id===state.selectedId)}
function sortedUnique(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function syncFilters(){
 const large=document.querySelector('#largeFilter'), detail=document.querySelector('#detailFilter');
 const larges=sortedUnique(state.exercises.map(x=>x.large)); large.innerHTML='<option value="">全部大部位</option>'+larges.map(x=>`<option ${x===state.filters.large?'selected':''}>${esc(x)}</option>`).join('');
 const details=sortedUnique(state.exercises.filter(x=>!state.filters.large||x.large===state.filters.large).map(x=>x.detail)); detail.innerHTML='<option value="">全部細部位</option>'+details.map(x=>`<option ${x===state.filters.detail?'selected':''}>${esc(x)}</option>`).join('');
 document.querySelector('#keyword').value=state.filters.q;
}
function filtered(){const q=state.filters.q.trim().toLowerCase();return state.exercises.filter(x=>(!state.filters.large||x.large===state.filters.large)&&(!state.filters.detail||x.detail===state.filters.detail)&&(!q||[x.name,x.large,x.detail,x.primary,x.secondary,x.description].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'))}
function renderResults(){const list=filtered();document.querySelector('#resultCount').textContent=`找到 ${list.length} 個動作`;document.querySelector('#resultList').innerHTML=list.length?list.map(x=>`<button class="result ${x.id===state.selectedId?'active':''}" data-id="${esc(x.id)}"><div class="result-name">${esc(x.name)}</div></button>`).join(''):'<div class="empty">沒有符合條件的動作</div>';document.querySelectorAll('.result').forEach(b=>b.onclick=()=>{state.selectedId=b.dataset.id;renderResults();renderDetail()})}

function youtubeId(url){const v=String(url||'').trim();if(/^[a-zA-Z0-9_-]{11}$/.test(v))return v;try{const u=new URL(v);const host=u.hostname.toLowerCase().replace(/^www\./,'');if(host==='youtu.be')return /^[A-Za-z0-9_-]{11}$/.test(u.pathname.slice(1).split('/')[0])?u.pathname.slice(1).split('/')[0]:'';if(['youtube.com','m.youtube.com','youtube-nocookie.com'].includes(host)){let id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})/)?.[1];return /^[A-Za-z0-9_-]{11}$/.test(id||'')?id:''}}catch(e){}return ''}
function getVideo(e){if(Object.prototype.hasOwnProperty.call(e,'videoUrl'))return String(e.videoUrl||'');const inDesc=(e.description||'').match(/https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)[A-Za-z0-9_?=&-]+/);return (inDesc?inDesc[0]:VERIFIED_VIDEOS[e.name])||''}

function bindDetail(e){
const localNotice=document.querySelector("#localVideoNotice");if(localNotice&&location.protocol==="file:")localNotice.style.display="block";document.querySelector('#editVideo').onclick=()=>document.querySelector('#videoEditor').style.display='block';document.querySelector('#cancelVideo').onclick=()=>document.querySelector('#videoEditor').style.display='none';document.querySelector('#saveVideo').onclick=()=>{let val=document.querySelector('#videoInput').value.trim();if(val&&!youtubeId(val))return toast('請貼上有效的 YouTube 網址或影片 ID');e.videoUrl=val;save();renderDetail();toast('影片已修改，等待雲端確認')};document.querySelector('#clearVideo').onclick=()=>{e.videoUrl='';save();renderDetail();toast('影片已移除，等待雲端確認')};document.querySelector('#toggleDesc').onclick=()=>{document.querySelector('#descRead').style.display='none';document.querySelector('#descEdit').style.display='block'};document.querySelector('#cancelDesc').onclick=()=>renderDetail();document.querySelector('#saveDesc').onclick=()=>{e.description=document.querySelector('#descArea').value.trim();save();renderDetail();toast('說明已修改，等待雲端確認')};document.querySelector('#addHist').onclick=()=>{if(window.CloudTraining?.configured&&!window.CloudTraining?.ready)return toast('雲端未載入完成，這筆紀錄尚未儲存');const date=document.querySelector('#histDate').value,content=document.querySelector('#histContent').value.trim(),rpe=document.querySelector('#histRpe').value.trim();if(!date||!content)return toast('請選日期並填訓練內容');if(!rpeValid(rpe))return toast('RPE 請輸入 1 到 10 的整數');e.history=e.history||[];e.history.push({id:uid('hist'),date,content,...(rpe===''?{}:{rpe:Number(rpe)})});save();renderDetail();toast('紀錄已新增，等待雲端確認')};document.querySelectorAll('.detail-rpe').forEach(inp=>inp.onchange=()=>{const hid=inp.closest('[data-hid]').dataset.hid;if(!updateHistoryRpe(e,hid,inp.value.trim())){toast('RPE 請輸入 1 到 10 的整數');inp.value=rpeValue((e.history||[]).find(h=>String(h.id)===hid)||{});return}toast('RPE 已修改，等待雲端確認')});document.querySelectorAll('.delHist').forEach(b=>b.onclick=()=>{if(confirm('確定刪除這筆歷史紀錄？')){e.history=e.history.filter(h=>h.id!==b.dataset.hid);save();renderDetail();toast('已刪除，等待雲端確認')}});document.querySelector('#editExercise').onclick=()=>openEdit(e);const syncBtn=document.querySelector('#syncPublicExercise');if(syncBtn)syncBtn.onclick=async()=>{const api=window.CloudTraining;const report=document.querySelector('#syncPublicResult');if(!api?.ready){if(report)report.textContent='私人動作資料尚未載入完成';return toast('請先等待雲端載入');}if(!confirm(`確定用公用動作庫最新資料覆蓋「${e.name}」的個人設定？\n這個動作原本的所有訓練紀錄與 RPE 都會保留。`))return;syncBtn.disabled=true;syncBtn.textContent='同步中…';if(report)report.textContent='正在核對公用動作…';try{const result=await api.syncExerciseFromPublic(e.id,{name:e.name,large:e.large,detail:e.detail});const message=result?.ok?'Firestore 已確認：此動作已更新，訓練紀錄未變動':(result?.error||'同步失敗');const current=document.querySelector('#syncPublicResult');if(current)current.textContent=message;toast(message);}catch(error){const message='同步失敗：'+(error?.message||'未知錯誤');const current=document.querySelector('#syncPublicResult');if(current)current.textContent=message;toast(message);}finally{const currentButton=document.querySelector('#syncPublicExercise');if(currentButton){currentButton.disabled=false;currentButton.textContent='同步公用動作庫';}}}}
function muscleChecks(selected=[],prefix='m'){

function selectedMuscleIds(prefix){return [...document.querySelectorAll(`#formRoot input[name="${prefix}"]:checked`)].map(n=>n.value)}

function dedupeMuscleText(value){return [...new Set(String(value||'').split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean))]}
function previousManualText(e,side){
  if(typeof e[side+'Manual']==='string')return e[side+'Manual'];
  const chosen=new Set(muscleLabels(e[side==='primary'?'primaryMuscles':'secondaryMuscles']||[]));
  return dedupeMuscleText(e[side]).filter(t=>!chosen.has(t)).join('、');
}
function repaintEditorLabels(){
  for(const [side,prefix] of [['primary','pm'],['secondary','sm']]){
    const el=document.querySelector('#form'+(side==='primary'?'Primary':'Secondary')+'Auto');
    if(el)el.innerHTML=muscleLabels(selectedMuscleIds(prefix)).map(label=>`<span class="auto-muscle-label">${esc(label)}</span>`).join('');
  }
}
function redrawEditorPreview(){
  const root=document.querySelector('#editorModelPreview svg');if(!root)return;
  const primary=new Set(selectedMuscleIds('pm')),secondary=new Set(selectedMuscleIds('sm'));
  root.querySelectorAll('.muscle[data-muscle]').forEach(el=>{
    el.classList.toggle('primary',primary.has(el.dataset.muscle));
    el.classList.toggle('secondary',!primary.has(el.dataset.muscle)&&secondary.has(el.dataset.muscle));
  });
}
function installEditorModel(){
  const target=document.querySelector('#editorModelPreview');if(!target)return;
  let source=document.querySelector('#detailPanel svg.interactive-gray-model');
  if(!source && state.exercises.length){renderDetail();source=document.querySelector('#detailPanel svg.interactive-gray-model')}
  if(!source){target.innerHTML='<div class="empty">暫無可顯示的人體模型</div>';return}
  const clone=source.cloneNode(true);
  // Rename mask IDs to avoid clashes with the detail view SVG still in DOM.
  const idMap=new Map();
  clone.querySelectorAll('[id]').forEach(el=>{const old=el.id;const unique='editor-'+old;idMap.set(old,unique);el.id=unique});
  clone.querySelectorAll('[mask],[clip-path],[filter]').forEach(el=>{
    for(const attr of ['mask','clip-path','filter']){
      const old=el.getAttribute(attr);if(old)el.setAttribute(attr,old.replace(/url\(#([^)]*)\)/g,(_,id)=>`url(#${idMap.get(id)||id})`));
    }
  });
  target.replaceChildren(clone);
  redrawEditorPreview();
}
function syncEditorMuscleSelections(changed){
  const prefix=changed.name==='pm'?'sm':'pm';
  if(changed.checked){const other=document.querySelector(`#formRoot input[name="${prefix}"][value="${changed.value}"]`);if(other)other.checked=false}
  const p=new Set(selectedMuscleIds('pm')),q=new Set(selectedMuscleIds('sm'));
  document.querySelectorAll('#formRoot input[name="pm"]').forEach(input=>{input.disabled=q.has(input.value)});
  document.querySelectorAll('#formRoot input[name="sm"]').forEach(input=>{input.disabled=p.has(input.value)});
  repaintEditorLabels();redrawEditorPreview();
}
function fillDetailSelect(largeVal='',detailVal=''){const l=document.querySelector('#formLarge'),d=document.querySelector('#formDetail');const larges=sortedUnique([...state.exercises.map(x=>x.large),'上肢','下肢','核心','綜合']);l.innerHTML='<option value="">請選擇</option>'+larges.map(x=>`<option ${x===largeVal?'selected':''}>${esc(x)}</option>`).join('');const details=sortedUnique(state.exercises.filter(x=>!l.value||x.large===l.value).map(x=>x.detail));d.innerHTML='<option value="">請選擇或直接輸入下方新細部位</option>'+details.map(x=>`<option ${x===detailVal?'selected':''}>${esc(x)}</option>`).join('')}
function renderForm(edit=null){
 const root=document.querySelector('#formRoot');
 const e=edit||{large:'',detail:'',name:'',primary:'',secondary:'',description:'',warmup:'',primaryMuscles:[],secondaryMuscles:[]};
 const primaryIds=[...new Set(e.primaryMuscles||[])],secondaryIds=[...new Set((e.secondaryMuscles||[]).filter(id=>!primaryIds.includes(id)))];
 root.innerHTML=`<div class="card"><div class="exercise-head"><div><div class="crumb">${edit?'編輯現有動作':'建立自訂動作'}${window.CloudTraining?.configured && window.CloudTraining?.hasUser ? (window.CloudTraining?.isAdmin?' · 共用動作庫':' · 僅自己的帳號') : ''}</div><h2>${edit?esc(edit.name):'新增動作'}</h2></div></div>
 <div class="form-grid">
 <div class="field"><div class="label">大部位</div><select id="formLarge" class="select"></select></div>
 <div class="field"><div class="label">細部位</div><select id="formDetail" class="select"></select><input id="formDetailNew" class="input" style="margin-top:8px" placeholder="沒有合適選項時，在這裡輸入新細部位"></div>
 <div class="field full"><div class="label">動作名稱</div><input id="formName" class="input" value="${esc(e.name)}"></div>
 <div class="editor-muscle-layout">
  <div class="editor-muscle-controls">
   <div class="field"><div class="label">主要訓練部位（文字）</div><div class="muscle-text-box"><span id="formPrimaryAuto"></span><input id="formPrimaryManual" value="${esc(previousManualText(e,'primary'))}" placeholder="手動補充部位（黑字）"></div><div class="muscle-text-note">紅字由主要亮顯肌群自動帶入，黑字可自行輸入。</div></div>
   <div class="field"><div class="label">次要訓練部位（文字）</div><div class="muscle-text-box"><span id="formSecondaryAuto"></span><input id="formSecondaryManual" value="${esc(previousManualText(e,'secondary'))}" placeholder="手動補充部位（黑字）"></div><div class="muscle-text-note">取消亮顯會同步移除對應的紅字，手動文字不受影響。</div></div>
   <div class="field"><div class="label">主要肌群亮顯</div><div class="muscle-picker" id="primaryPicker">${muscleChecks(primaryIds,'pm')}</div></div>
   <div class="field"><div class="label">次要肌群亮顯</div><div class="muscle-picker" id="secondaryPicker">${muscleChecks(secondaryIds,'sm')}</div></div>
  </div>
  <div class="editor-preview"><h3>肌群模型｜即時預覽</h3><div id="editorModelPreview"></div><div class="model-legend"><span><i class="dot" style="background:#e6333b"></i>主要肌群</span><span><i class="dot" style="background:#ffc247"></i>次要肌群</span><span><i class="dot" style="background:#b4b4b4"></i>未選肌群</span></div></div>
 </div>
 <div class="field full"><div class="label">動作說明</div><textarea id="formDesc" class="textarea">${esc(e.description)}</textarea></div>
 <div class="field full"><div class="label">YouTube 教學影片（選填，可日後修改）</div><input id="formVideo" class="input" placeholder="貼上 YouTube 網址" value="${esc(getVideo(e))}"></div>
 <div class="full toolbar"><button class="btn primary" id="saveExercise">${edit?'儲存修改':'新增動作'}</button>${edit?'<button class="btn danger" id="deleteExercise">刪除這個動作</button>':''}<button class="btn" id="cancelForm">取消</button></div>
 </div></div>`;
 fillDetailSelect(e.large,e.detail);
 document.querySelector('#formLarge').onchange=()=>fillDetailSelect(document.querySelector('#formLarge').value,e.detail);
 root.querySelectorAll('input[name="pm"],input[name="sm"]').forEach(n=>n.addEventListener('change',()=>syncEditorMuscleSelections(n)));
 syncEditorMuscleSelections({name:'pm',value:'',checked:false});
 installEditorModel();
 document.querySelector('#saveExercise').onclick=()=>saveExerciseForm(edit);
 document.querySelector('#cancelForm').onclick=()=>showPage('search');
 if(edit)document.querySelector('#deleteExercise').onclick=()=>{if((!window.CloudTraining?.configured||window.CloudTraining?.ready)&&confirm(`確定${window.CloudTraining?.configured && !window.CloudTraining?.isAdmin ? '只在自己的帳號隱藏／刪除' : '從共用動作庫刪除'}「${edit.name}」？`)){state.exercises=state.exercises.filter(x=>x.id!==edit.id);state.selectedId=state.exercises[0]?.id||null;save();window.CloudTraining?.flushNow?.();showPage('search');renderAll();toast('已刪除，正在同步至雲端')}};
}
function saveExerciseForm(edit){
 if(window.CloudTraining?.configured && !window.CloudTraining?.hasUser)return toast('請先登入才能新增或修改動作');
 if(window.CloudTraining?.configured && !window.CloudTraining?.ready)return toast('雲端資料尚未載入完成，暫時不能儲存，請稍後再試');
 const large=document.querySelector('#formLarge').value.trim(),detail=(document.querySelector('#formDetailNew').value.trim()||document.querySelector('#formDetail').value.trim()),name=document.querySelector('#formName').value.trim();
 if(!large||!detail||!name)return toast('大部位、細部位與動作名稱為必填');
 const primaryMuscles=selectedMuscleIds('pm'),secondaryMuscles=selectedMuscleIds('sm').filter(id=>!primaryMuscles.includes(id));
 const primaryManual=document.querySelector('#formPrimaryManual').value.trim(),secondaryManual=document.querySelector('#formSecondaryManual').value.trim();
 const primary=dedupeMuscleText([...muscleLabels(primaryMuscles),...dedupeMuscleText(primaryManual)].join('、')).join('、');
 const secondary=dedupeMuscleText([...muscleLabels(secondaryMuscles),...dedupeMuscleText(secondaryManual)].join('、')).join('、');
 const videoVal=document.querySelector('#formVideo').value.trim();if(videoVal&&!youtubeId(videoVal))return toast('YouTube 網址格式不正確');
 const obj=edit||{id:uid('custom'),history:[]};
 Object.assign(obj,{large,detail,name,primary,secondary,primaryManual,secondaryManual,description:document.querySelector('#formDesc').value.trim(),primaryMuscles,secondaryMuscles,videoUrl:videoVal});
 if(!edit)state.exercises.push(obj);
 state.selectedId=obj.id;save();showPage('search');renderAll();toast(edit?'動作已修改，等待雲端確認':'動作已新增，等待雲端確認');
}
function openEdit(e){if(window.CloudTraining?.configured && !window.CloudTraining?.hasUser)return toast('請先登入才能編輯動作');showPage('add');renderForm(e)}
let selectedRecordKeys=new Set();
let currentRecordEdit=null;
function recordKey(eid,hid){return JSON.stringify([String(eid),String(hid)])}
function findRecord(eid,hid){const exercise=state.exercises.find(e=>String(e.id)===String(eid));return {exercise,record:(exercise?.history||[]).find(h=>String(h.id)===String(hid))}}
function updateRecordSelectionToolbar(){const count=selectedRecordKeys.size;const n=document.querySelector('#selectedRecordCount');if(n)n.textContent=`已選 ${count} 筆`;const button=document.querySelector('#deleteSelectedRecords');if(button)button.disabled=!count;}
function showRecordEditor(eid,hid){if(!window.CloudTraining?.hasUser||!window.CloudTraining?.ready)return toast('請先登入並等待雲端同步');const {exercise,record}=findRecord(eid,hid);if(!exercise||!record)return toast('找不到該筆紀錄');currentRecordEdit={eid,hid};document.querySelector('#recordEditDate').value=record.date||'';document.querySelector('#recordEditContent').value=record.content||'';document.querySelector('#recordEditRpe').value=rpeValue(record);document.querySelector('#recordEditDialog').showModal();}
function saveRecordEditor(){if(!currentRecordEdit)return false;const {exercise,record}=findRecord(currentRecordEdit.eid,currentRecordEdit.hid);if(!exercise||!record)return false;const date=document.querySelector('#recordEditDate').value,content=document.querySelector('#recordEditContent').value.trim(),rpe=document.querySelector('#recordEditRpe').value.trim();if(!date||!content||!rpeValid(rpe)){toast('請填日期、訓練內容，RPE 限 1～10 或留空');return false;}record.date=date;record.content=content;if(rpe==='')delete record.rpe;else record.rpe=Number(rpe);save();document.querySelector('#recordEditDialog').close();currentRecordEdit=null;renderDetail();renderOverview();toast('已送出紀錄修改，等待雲端確認');return true;}
function removeRecords(keys){let deleted=0;const perExercise=new Map();for(const value of keys){const [eid,hid]=JSON.parse(value);if(!perExercise.has(eid))perExercise.set(eid,new Set());perExercise.get(eid).add(hid);}for(const e of state.exercises){const ids=perExercise.get(String(e.id));if(!ids)continue;const before=(e.history||[]).length;e.history=(e.history||[]).filter(h=>!ids.has(String(h.id)));deleted+=before-e.history.length;}if(deleted){save();selectedRecordKeys.clear();renderAll();}return deleted;}
function renderOverview(){
 const byDate=new Map();
 state.exercises.forEach(e=>(e.history||[]).forEach(h=>{const date=h.date||'未標日期';if(!byDate.has(date))byDate.set(date,[]);byDate.get(date).push({exercise:e,record:h})}));
 const dates=[...byDate.keys()].sort((a,b)=>b.localeCompare(a));
 const root=document.querySelector('#historyOverview');
 const allKeys=new Set(state.exercises.flatMap(e=>(e.history||[]).map(h=>recordKey(e.id,h.id))));
 selectedRecordKeys=new Set([...selectedRecordKeys].filter(k=>allKeys.has(k)));
 root.innerHTML=dates.length?dates.map(date=>{
  const entries=byDate.get(date);
  return `<div class="history-day-card"><div class="history-day-header"><div class="date">${esc(date)}</div><span class="history-day-count">${entries.length} 筆訓練</span></div><div class="history-day-entries">${entries.map(({exercise:e,record:h})=>`<div class="history-day-entry"><label class="record-checkbox-cell" title="勾選此筆訓練紀錄"><input type="checkbox" aria-label="選擇 ${esc(e.name)} 的訓練紀錄" class="record-check" data-eid="${esc(e.id)}" data-hid="${esc(h.id)}" ${selectedRecordKeys.has(recordKey(e.id,h.id))?'checked':''}></label><div class="history-entry-name"><div class="history-entry-title">${esc(e.name)}</div><div class="history-entry-category">${esc(e.large)} / ${esc(e.detail)}</div></div><div class="history-entry-content">${nl(h.content)}</div><span class="record-rpe-cell" data-eid="${esc(e.id)}" data-hid="${esc(h.id)}">${rpeField(h,'overview-rpe')}</span><div class="record-edit-cell"><button class="btn small record-edit-button" data-eid="${esc(e.id)}" data-hid="${esc(h.id)}">編輯</button></div></div>`).join('')}</div></div>`;
 }).join(''):'<div class="empty">尚無訓練紀錄</div>';
 root.querySelectorAll('.record-check').forEach(inp=>inp.onchange=()=>{const k=recordKey(inp.dataset.eid,inp.dataset.hid);if(inp.checked)selectedRecordKeys.add(k);else selectedRecordKeys.delete(k);updateRecordSelectionToolbar();});
 root.querySelectorAll('.record-edit-button').forEach(btn=>btn.onclick=()=>showRecordEditor(btn.dataset.eid,btn.dataset.hid));
 root.querySelectorAll('.overview-rpe').forEach(inp=>inp.onchange=()=>{
  const owner=inp.closest('[data-eid]');const e=state.exercises.find(x=>String(x.id)===owner.dataset.eid);
  if(!e||!updateHistoryRpe(e,owner.dataset.hid,inp.value.trim())){toast('RPE 請輸入 1 到 10 的整數');inp.value=rpeValue((e?.history||[]).find(h=>String(h.id)===owner.dataset.hid)||{});return;}
  toast('RPE 已修改，等待雲端確認');
 });updateRecordSelectionToolbar();
}
function renderManager(){document.querySelector('#managerStats').innerHTML=`目前共有 <b>${state.exercises.length}</b> 個動作，<b>${state.exercises.reduce((n,e)=>n+(e.history?.length||0),0)}</b> 筆訓練紀錄。`;const b=document.querySelector('#restorePublicCatalog');if(b)b.hidden=!(window.CloudTraining?.configured&&window.CloudTraining?.hasUser&&!window.CloudTraining?.isAdmin);}
async function openCatalogRestore(){
 const api=window.CloudTraining;
 if(!api?.hasUser||api.isAdmin)return toast('此功能僅供一般會員還原自己的動作庫');
 if(!api.ready)return toast('請等待私人動作庫載入');
 const button=document.querySelector('#restorePublicCatalog');button.disabled=true;
 try{const info=await api.inspectPublicRestore();if(!info?.ok){toast(info?.error||'讀取公用庫失敗');return;}
  window._restoreInfo=info;
  document.querySelector('#restoreCatalogSummary').textContent=`公用動作 ${info.publicCount} 個；目前私人動作 ${info.personalCount} 個；其中自行新增 ${info.customCount} 個。`;
  const opt=document.querySelector('#removeCustomOption');opt.hidden=info.customCount===0;
  document.querySelector('#removeCustomExercises').checked=false;
  document.querySelector('#restoreCatalogDialog').showModal();
 }finally{button.disabled=false;}
}
async function submitCatalogRestore(){const info=window._restoreInfo;if(!info)return;const remove=document.querySelector('#removeCustomExercises').checked&&info.customCount>0;const msg=`確定要以目前公用動作庫還原自己的 ${info.publicCount} 個對應動作嗎？\n${remove?`將另外刪除 ${info.customCount} 個自行新增動作。`:'自行新增動作會保留。'}\n所有訓練紀錄及 RPE 都不會被修改。`;if(!confirm(msg))return;
 const btn=document.querySelector('#confirmCatalogRestore');btn.disabled=true;
 try{const result=await window.CloudTraining.restorePersonalFromPublic({removeCustom:remove});if(result?.ok){document.querySelector('#restoreCatalogDialog').close();showPage('search');toast('動作已還原；所有訓練紀錄保留');}else toast(result?.error||'動作還原失敗');}finally{btn.disabled=false;}}
function showPage(page){if(page==='history' && window.CloudTraining?.configured && !window.CloudTraining?.hasUser){toast('登入 Google 才能查看私人訓練紀錄');page='search';}if(page==='add' && window.CloudTraining?.configured && !window.CloudTraining?.hasUser){toast('請先登入才能新增個人動作');page='search';}if(page==='manage' && window.CloudTraining?.configured && !window.CloudTraining?.hasUser){toast('請先登入 Google 才能備份自己的紀錄');page='search';}state.page=page;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===page));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));if(page==='add'&&!document.querySelector('#formRoot .card'))renderForm();if(page==='history')renderOverview();if(page==='manage')renderManager()}
function renderAll(){syncFilters();renderResults();renderDetail();renderOverview();renderManager()}
window.StrengthApp={
  getExercises:()=>state.exercises,
  showSearch:()=>showPage('search'),
  initialExercises:()=>migrateExercises(clone(INITIAL_DATA)),
  replaceExercises:items=>{state.exercises=migrateExercises(clone(items||[]));if(!state.exercises.some(e=>e.id===state.selectedId))state.selectedId=state.exercises[0]?.id||null;renderAll()}
};
function download(filename,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportData(){download(`肌力訓練備份_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:1,exportedAt:new Date().toISOString(),exercises:state.exercises},null,2));toast('備份檔已匯出')}
function importData(file){const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||!Array.isArray(data.exercises))throw Error('格式錯誤');state.exercises=migrateExercises(data.exercises);state.selectedId=state.exercises[0]?.id||null;save();renderAll();toast('備份資料已匯入')}catch(e){alert('無法匯入：檔案格式不正確')}};r.readAsText(file)}

document.addEventListener('DOMContentLoaded',()=>{load();document.querySelector('#largeFilter').onchange=e=>{state.filters.large=e.target.value;state.filters.detail='';syncFilters();renderResults()};document.querySelector('#detailFilter').onchange=e=>{state.filters.detail=e.target.value;renderResults()};document.querySelector('#keyword').oninput=e=>{state.filters.q=e.target.value;renderResults()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(t.dataset.page==='add')renderForm();showPage(t.dataset.page)});document.querySelectorAll('[data-export]').forEach(b=>b.onclick=exportData);document.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>document.querySelector('#importFile').click());document.querySelector('#importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};document.querySelector('#resetData').onclick=()=>{if(window.CloudTraining?.configured)return toast('共用動作庫不可用 Excel 一鍵重設，避免恢復已刪除動作');if(confirm('這會用 Excel 原始資料取代目前紀錄；如果已登入且連線，這些變更也會同步到雲端。請先匯出 JSON 備份。確定嗎？')){state.exercises=migrateExercises(clone(INITIAL_DATA));state.selectedId=state.exercises[0]?.id||null;save();renderAll();toast('已還原 Excel 初始資料')}};document.querySelector('#recordEditForm').addEventListener('submit',event=>{event.preventDefault();saveRecordEditor();});
document.querySelector('#cancelRecordEdit').onclick=()=>document.querySelector('#recordEditDialog').close();
document.querySelector('#selectAllRecords').onclick=()=>{selectedRecordKeys=new Set(state.exercises.flatMap(e=>(e.history||[]).map(h=>recordKey(e.id,h.id))));renderOverview()};
document.querySelector('#clearSelectedRecords').onclick=()=>{selectedRecordKeys.clear();renderOverview()};
document.querySelector('#deleteSelectedRecords').onclick=()=>{if(!selectedRecordKeys.size)return;const total=selectedRecordKeys.size;if(confirm(`確定刪除已選取的 ${total} 筆訓練紀錄？刪除後會同步到你的個人雲端。`)){removeRecords([...selectedRecordKeys]);toast('已送出批量刪除，等待雲端確認');}};
document.querySelector('#deleteAllRecords').onclick=()=>{const count=state.exercises.reduce((n,e)=>n+(e.history||[]).length,0);if(!count)return toast('目前沒有訓練紀錄');if(confirm(`確定要刪除自己帳號的全部 ${count} 筆訓練紀錄嗎？\n這不會更動任何動作資料。建議先匯出 JSON 備份。`)){removeRecords(state.exercises.flatMap(e=>(e.history||[]).map(h=>recordKey(e.id,h.id))));toast('已送出全部刪除，等待雲端確認');}};
document.querySelector('#restorePublicCatalog').onclick=openCatalogRestore;
document.querySelector('#cancelCatalogRestore').onclick=()=>document.querySelector('#restoreCatalogDialog').close();
document.querySelector('#confirmCatalogRestore').onclick=submitCatalogRestore;
renderAll()});
</script><script type="module" src="cloud-sync.js"></script></body></html>
